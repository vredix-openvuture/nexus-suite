<script>
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
function eq(n, g, w) { const a = JSON.stringify(g), b = JSON.stringify(w); ok(n, a === b, 'got ' + a + ' want ' + b); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

(async () => {
try {
const P = window.plannerLib;
const TFile = window.obsidianStub.TFile;

// ── dates ──────────────────────────────────────────────────────────────────
{
  eq('date · a day later', P.addDays('2026-09-03', 1), '2026-09-04');
  eq('date · across a month end', P.addDays('2026-09-30', 1), '2026-10-01');
  eq('date · across a year end', P.addDays('2026-12-31', 1), '2027-01-01');
  eq('date · backwards', P.addDays('2026-01-01', -1), '2025-12-31');
  eq('date · a leap day exists in 2028', P.addDays('2028-02-28', 1), '2028-02-29');
  eq('date · and not in 2027', P.addDays('2027-02-28', 1), '2027-03-01');
  eq('date · rubbish comes back unchanged', P.addDays('nonsense', 1), 'nonsense');

  eq('month · label', P.monthLabel('2026-09'), 'September 2026');
  eq('month · a month later', P.addMonths('2026-11', 2), '2027-01');
  eq('month · and earlier', P.addMonths('2026-01', -1), '2025-12');
  eq('month · a whole year on', P.addMonths('2026-06', 12), '2027-06');

  // 2026-09-03 is a Thursday.
  eq('week · Thursday is index 3 with Monday first', P.weekdayIndex('2026-09-03', 'monday'), 3);
  eq('week · and 4 with Sunday first', P.weekdayIndex('2026-09-03', 'sunday'), 4);
  eq('week · the week starts on the Monday', P.startOfWeek('2026-09-03', 'monday'), '2026-08-31');
  eq('week · or on the Sunday', P.startOfWeek('2026-09-03', 'sunday'), '2026-08-30');
}

// ── the grid ───────────────────────────────────────────────────────────────
{
  const weeks = P.monthGrid('2026-09', 'monday');
  eq('grid · always six rows, so the block never changes height', weeks.length, P.MONTH_ROWS);
  eq('grid · seven days each', weeks[0].length, 7);
  eq('grid · September 2026 starts on a Tuesday, so the row opens on 31 August',
     weeks[0][0].date, '2026-08-31');
  ok('grid · and that day is marked as outside the month', !weeks[0][0].inMonth);
  ok('grid · the first of the month is inside it', weeks[0][1].inMonth && weeks[0][1].day === 1);
  const all = weeks.flat();
  eq('grid · every day of the month is present',
     all.filter(d => d.inMonth).length, 30);
  eq('grid · the days run without a gap',
     all.every((d, i) => i === 0 || d.date === P.addDays(all[i - 1].date, 1)), true);

  const sunday = P.monthGrid('2026-09', 'sunday');
  eq('grid · a Sunday-first month starts a day earlier', sunday[0][0].date, '2026-08-30');

  const week = P.weekDays('2026-09-03', 'monday');
  eq('week · seven days from the Monday', week.map(d => d.date),
     ['2026-08-31', '2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04', '2026-09-05', '2026-09-06']);
}

// ── the block format ───────────────────────────────────────────────────────
{
  const src = [
    'view: month',
    'month: 2026-09',
    'title: Autumn',
    '2026-09-03: Ship 0.25',
    '2026-09-11: Dentist, 14:00',
  ].join('\n');
  const cfg = P.parsePlanner(src);
  eq('parse · the view', cfg.view, 'month');
  eq('parse · the month', cfg.month, '2026-09');
  eq('parse · the title', cfg.title, 'Autumn');
  eq('parse · the entries', cfg.entries,
     { '2026-09-03': 'Ship 0.25', '2026-09-11': 'Dentist, 14:00' });
  eq('parse · and it round trips', P.stringifyPlanner(cfg), src);

  // A colon in the text is not a config line.
  eq('parse · a time in the text survives',
     P.parsePlanner('2026-09-11: Dentist, 14:00').entries['2026-09-11'], 'Dentist, 14:00');
  // An empty entry is not stored at all.
  eq('parse · a blank day is not an entry', P.parsePlanner('2026-09-01:   ').entries, {});
  // Anything unrecognised is kept and written back untouched.
  const odd = P.parsePlanner('view: month\nsomething odd\nnote: keep me');
  ok('parse · unknown lines are kept', odd.extra.indexOf('something odd') >= 0);
  ok('parse · and unknown keys too', odd.extra.indexOf('note: keep me') >= 0);
  ok('parse · so they survive a rewrite', P.stringifyPlanner(odd).indexOf('something odd') >= 0);

  eq('parse · weekstart', P.parsePlanner('weekstart: sunday').weekStart, 'sunday');
  eq('parse · defaults to monday', P.parsePlanner('').weekStart, 'monday');
  eq('parse · an empty block is a month view', P.parsePlanner('').view, 'month');

  const sorted = P.parsePlanner('2026-09-20: late\n2026-09-01: early');
  ok('stringify · entries come out in date order',
     P.stringifyPlanner(sorted).indexOf('09-01') < P.stringifyPlanner(sorted).indexOf('09-20'));

  const one = P.parsePlanner('2026-09-01: x');
  P.setEntry(one, '2026-09-01', '');
  eq('entry · clearing one removes it rather than storing a blank', one.entries, {});
  P.setEntry(one, '2026-09-02', '  spaced  ');
  eq('entry · text is trimmed', one.entries['2026-09-02'], 'spaced');
  P.setEntry(one, '2026-09-03', 'two\nlines');
  eq('entry · a newline cannot break the one-line-per-day format',
     one.entries['2026-09-03'], 'two lines');
}

// ── rendered, and writing back ─────────────────────────────────────────────
function makeApp(text) {
  const file = new TFile();
  file.path = 'Plan.md'; file.basename = 'Plan'; file.extension = 'md';
  const store = { 'Plan.md': { file, text } };
  return {
    _store: store,
    vault: {
      getAbstractFileByPath(p) { return store[p] ? store[p].file : null; },
      async read(f) { return store[f.path].text; },
      async modify(f, next) { store[f.path].text = next; },
      async create(p, t) { const nf = new TFile(); nf.path = p; nf.basename = p.split('/').pop().replace('.md',''); store[p] = { file: nf, text: t }; return nf; },
    },
    workspace: { getLeaf: () => ({ openFile() {} }) },
    internalPlugins: { getPluginById: () => null },
  };
}
function ctxFor(app) {
  return {
    sourcePath: 'Plan.md',
    getSectionInfo() {
      const lines = app._store['Plan.md'].text.split('\n');
      const start = lines.findIndex(l => l.trim().indexOf('```nexus-planner') === 0);
      if (start < 0) return null;
      let end = start + 1;
      while (end < lines.length && lines[end].trim().indexOf('```') !== 0) end++;
      return { text: app._store['Plan.md'].text, lineStart: start, lineEnd: end };
    },
  };
}
function blockOf(app) {
  const lines = app._store['Plan.md'].text.split('\n');
  const start = lines.findIndex(l => l.trim().indexOf('```nexus-planner') === 0);
  let end = start + 1;
  while (end < lines.length && lines[end].trim().indexOf('```') !== 0) end++;
  return lines.slice(start + 1, end);
}

{
  const NOTE = ['# Plan', '', '```nexus-planner', 'view: month', 'month: 2026-09', '```', '', 'After.'].join('\n');
  const app = makeApp(NOTE);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const el = stage.createDiv();
  const pl = new window.NexusPlanner({ app, settings: { planner: { enabled: true } } });
  pl.today = () => '2026-09-15';
  pl.render('view: month\nmonth: 2026-09', el, ctxFor(app));

  eq('render · seven weekday headings', el.querySelectorAll('.nx-pl-dow-c').length, 7);
  eq('render · forty-two cells', el.querySelectorAll('.nx-pl-cell').length, 42);
  eq('render · the month is named', el.querySelector('.nx-pl-title').textContent, 'September 2026');
  eq('render · one cell is today', el.querySelectorAll('.nx-pl-cell.is-today').length, 1);
  ok('render · and it is the fifteenth',
     el.querySelector('.nx-pl-cell.is-today .nx-pl-num').textContent === '15');
  ok('render · days outside the month are marked',
     el.querySelectorAll('.nx-pl-cell.is-outside').length > 0);

  // Type into a day and leave it.
  const cells = el.querySelectorAll('.nx-pl-cell');
  const input = cells[15].querySelector('.nx-pl-input');   // index 0 is 31 Aug, so 15 is 15 Sep
  input.value = 'Ship the release';
  input.dispatchEvent(new Event('blur'));
  await sleep(0);
  ok('write · the line is saved into the block',
     blockOf(app).some(l => l === '2026-09-15: Ship the release'), blockOf(app).join('|'));
  ok('write · the note around it survives', app._store['Plan.md'].text.indexOf('After.') > 0);

  // A second day, after the block has already been rewritten once.
  const el2 = document.querySelector('#stage > div');
  const again = el2.querySelectorAll('.nx-pl-cell')[16].querySelector('.nx-pl-input');
  again.value = 'Dentist';
  again.dispatchEvent(new Event('blur'));
  await sleep(0);
  const block = blockOf(app);
  ok('write · and so is the second one', block.some(l => l === '2026-09-16: Dentist'), block.join('|'));
  ok('write · without losing the first', block.some(l => l.indexOf('Ship the release') >= 0), block.join('|'));

  // Clearing a day removes the line.
  const el3 = document.querySelector('#stage > div');
  const clear = el3.querySelectorAll('.nx-pl-cell')[15].querySelector('.nx-pl-input');
  eq('write · the value came back on re-render', clear.value, 'Ship the release');
  clear.value = '';
  clear.dispatchEvent(new Event('blur'));
  await sleep(0);
  ok('write · clearing removes the line',
     !blockOf(app).some(l => l.indexOf('Ship the release') >= 0), blockOf(app).join('|'));
}

{
  // Paging and switching view write themselves back too.
  const NOTE = ['```nexus-planner', 'view: month', 'month: 2026-09', '```'].join('\n');
  const app = makeApp(NOTE);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const el = stage.createDiv();
  const pl = new window.NexusPlanner({ app, settings: { planner: { enabled: true } } });
  pl.today = () => '2026-09-15';
  pl.render('view: month\nmonth: 2026-09', el, ctxFor(app));

  el.querySelectorAll('.nx-pl-tool')[2].click();   // next month
  await sleep(0);
  ok('page · forward writes the new month', blockOf(app).indexOf('month: 2026-10') >= 0, blockOf(app).join('|'));
  document.querySelector('#stage > div').querySelectorAll('.nx-pl-tool')[0].click();   // previous
  await sleep(0);
  ok('page · and back again', blockOf(app).indexOf('month: 2026-09') >= 0, blockOf(app).join('|'));

  document.querySelector('#stage > div').querySelectorAll('.nx-pl-tool')[3].click();   // to the week
  await sleep(0);
  ok('page · switching to the week is saved', blockOf(app).indexOf('view: week') >= 0, blockOf(app).join('|'));
  const weekEl = document.querySelector('#stage > div');
  eq('page · a week is seven cells', weekEl.querySelectorAll('.nx-pl-cell').length, 7);
}

// ── the month note: where a month's plan lives ─────────────────────────────
/* A vault that behaves like Obsidian's on the two points that matter here:
   creating a file under a folder that does not exist FAILS, and a folder has
   to be made before the file. Without that, ensureParentFolder proves nothing. */
function makeVault(files) {
  const store = {};
  const folders = new Set();
  for (const path of Object.keys(files || {})) {
    const f = new TFile();
    f.path = path; f.extension = 'md'; f.basename = path.split('/').pop().replace(/\.md$/, '');
    store[path] = { file: f, text: files[path] };
    const dir = path.slice(0, path.lastIndexOf('/'));
    if (path.indexOf('/') >= 0) dir.split('/').forEach((_, i, all) => folders.add(all.slice(0, i + 1).join('/')));
  }
  const app = {
    _store: store, _folders: folders, _created: [],
    text(p) { return store[p] ? store[p].text : null; },
    vault: {
      getAbstractFileByPath(p) { return store[p] ? store[p].file : (folders.has(p) ? { path: p, children: [] } : null); },
      async read(f) { return store[f.path].text; },
      async modify(f, next) { store[f.path].text = next; },
      async createFolder(p) { if (folders.has(p)) throw new Error('exists'); folders.add(p); },
      async create(p, text) {
        const dir = p.slice(0, p.lastIndexOf('/'));
        if (p.indexOf('/') >= 0 && !folders.has(dir)) throw new Error('no such folder: ' + dir);
        const f = new TFile();
        f.path = p; f.extension = 'md'; f.basename = p.split('/').pop().replace(/\.md$/, '');
        store[p] = { file: f, text };
        app._created.push(p);
        return f;
      },
    },
  };
  return app;
}
const DEFAULT_STORE = { folder: 'Planner', pattern: 'YYYY-MM' };

{
  // ── the path a month resolves to ──
  eq('note · folder plus pattern', P.monthNotePath(DEFAULT_STORE, '2026-09'), 'Planner/2026-09.md');
  eq('note · no folder means the vault root',
     P.monthNotePath({ folder: '', pattern: 'YYYY-MM' }, '2026-09'), '2026-09.md');
  eq('note · a missing folder is the root too',
     P.monthNotePath({ pattern: 'YYYY-MM' }, '2026-09'), '2026-09.md');
  eq('note · a slash in the pattern makes a subfolder',
     P.monthNotePath({ folder: 'Planner', pattern: 'YYYY/YYYY-MM' }, '2026-09'), 'Planner/2026/2026-09.md');
  eq('note · stray slashes on the folder are trimmed',
     P.monthNotePath({ folder: '/Planner/', pattern: 'YYYY-MM' }, '2026-09'), 'Planner/2026-09.md');
  eq('note · a missing pattern falls back to YYYY-MM',
     P.monthNotePath({ folder: 'Planner' }, '2026-09'), 'Planner/2026-09.md');
  eq('note · rubbish for a month resolves to nothing', P.monthNotePath(DEFAULT_STORE, 'later'), '');

  eq('name · the month written out', P.formatMonthName('MMMM YYYY', '2026-09'), 'September 2026');
  eq('name · abbreviated', P.formatMonthName('YY-MMM', '2026-09'), '26-Sep');
  eq('name · MM is the number, MMM is not',
     [P.formatMonthName('MM', '2026-09'), P.formatMonthName('MMM', '2026-09')], ['09', 'Sep']);
  eq('name · a pattern with no token is one note for every month',
     P.formatMonthName('Plan', '2026-09'), 'Plan');

  eq('range · a month grid touches three months',
     P.monthsInRange('2026-08-31', '2026-10-11'), ['2026-08', '2026-09', '2026-10']);
  eq('range · a single month grid touches one', P.monthsInRange('2026-09-01', '2026-09-30'), ['2026-09']);
  eq('range · across a year end', P.monthsInRange('2026-12-28', '2027-01-31'), ['2026-12', '2027-01']);
}

{
  // ── reading a month that has no note ──
  const app = makeVault({});
  const plan = await P.readMonthPlan(app, TFile, DEFAULT_STORE, '2026-09');
  eq('read · a month with no note has no entries', plan.entries, {});
  eq('read · but it knows where the note would go', plan.path, 'Planner/2026-09.md');
  eq('read · and reading created nothing', app._created, []);
  eq('read · nor a folder', Array.from(app._folders), []);

  const many = await P.readMonthPlans(app, TFile, DEFAULT_STORE, ['2026-08', '2026-09']);
  eq('read · several empty months are still nothing', many, {});
  eq('read · and still created nothing', app._created, []);
}

{
  // ── the first line creates the note ──
  const app = makeVault({});
  const res = await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-03', 'Ship 0.25');
  ok('write · the first line succeeds', res.ok, JSON.stringify(res));
  eq('write · and creates the month note', app._created, ['Planner/2026-09.md']);
  eq('write · after making the folder it needs', Array.from(app._folders), ['Planner']);
  const text = app.text('Planner/2026-09.md');
  eq('write · the note is a fenced planner block and nothing else', text,
     '```nexus-planner\nview: month\nmonth: 2026-09\n2026-09-03: Ship 0.25\n```\n');
  const at = P.findPlannerBlock(text);
  ok('write · the block is found by the locator', !!at);
  eq('write · and the existing parser reads the line back',
     P.parsePlanner(at.body).entries, { '2026-09-03': 'Ship 0.25' });
  eq('write · the block says which month it is', P.parsePlanner(at.body).month, '2026-09');
  const back = await P.readMonthPlan(app, TFile, DEFAULT_STORE, '2026-09');
  eq('write · and reading the month gives the line', back.entries, { '2026-09-03': 'Ship 0.25' });

  // Clearing a day that was never written must not leave a file behind.
  const empty = makeVault({});
  await P.writeMonthEntry(empty, TFile, DEFAULT_STORE, '2026-10', '2026-10-05', '   ');
  eq('write · clearing a day of a month with no note creates nothing', empty._created, []);
}

{
  // ── editing one line leaves the rest alone ──
  const NOTE = [
    '# September',
    '',
    '```nexus-planner',
    'view: month',
    'month: 2026-09',
    '2026-09-03: Ship 0.25',
    '2026-09-11: Dentist, 14:00',
    '2026-09-20: Holiday',
    '```',
    '',
    'A paragraph the user wrote under the block.',
  ].join('\n');
  const app = makeVault({ 'Planner/2026-09.md': NOTE });
  const res = await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-11', 'Dentist, 15:30');
  ok('edit · the write succeeded', res.ok, JSON.stringify(res));
  const after = P.parsePlanner(P.findPlannerBlock(app.text('Planner/2026-09.md')).body);
  eq('edit · that day changed', after.entries['2026-09-11'], 'Dentist, 15:30');
  eq('edit · and the other days did not',
     [after.entries['2026-09-03'], after.entries['2026-09-20']], ['Ship 0.25', 'Holiday']);
  ok('edit · the prose around the block survives',
     app.text('Planner/2026-09.md').indexOf('A paragraph the user wrote under the block.') > 0);
  ok('edit · and so does the heading', app.text('Planner/2026-09.md').indexOf('# September') === 0);
  eq('edit · nothing new was created', app._created, []);

  await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-20', '');
  const cleared = await P.readMonthPlan(app, TFile, DEFAULT_STORE, '2026-09');
  ok('edit · clearing a line removes it', !('2026-09-20' in cleared.entries));
  eq('edit · and leaves the others', Object.keys(cleared.entries).sort(), ['2026-09-03', '2026-09-11']);
}

{
  // ── the round trip is lossless on a block a human touched ──
  const messy = [
    'view: month',
    'month: 2026-09',
    '2026-09-20: late',
    '',
    'a stray line the user typed',
    '2026-09-01: early',
    '2026-09-11: middle',
  ].join('\n');
  const cfg = P.parsePlanner(messy);
  const out = P.stringifyPlanner(cfg);
  ok('trip · the stray line survives', out.indexOf('a stray line the user typed') >= 0, out);
  const pairs = (e) => Object.keys(e).sort().map(k => k + ' = ' + e[k]);
  eq('trip · every entry survives', pairs(P.parsePlanner(out).entries), pairs(cfg.entries));
  eq('trip · in date order regardless of how they were typed',
     out.split('\n').filter(l => /^\d{4}-/.test(l)),
     ['2026-09-01: early', '2026-09-11: middle', '2026-09-20: late']);
  eq('trip · and a second pass changes nothing', P.stringifyPlanner(P.parsePlanner(out)), out);

  const app = makeVault({ 'Planner/2026-09.md': '```nexus-planner\n' + messy + '\n```' });
  await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-11', 'middle, moved');
  const body = P.findPlannerBlock(app.text('Planner/2026-09.md')).body;
  ok('trip · a write through the store keeps the stray line',
     body.indexOf('a stray line the user typed') >= 0, body);
  eq('trip · and only the edited day moved', P.parsePlanner(body).entries,
     { '2026-09-01': 'early', '2026-09-11': 'middle, moved', '2026-09-20': 'late' });
}

{
  // ── a note the user owns that happens to sit at the path ──
  const app = makeVault({ 'Planner/2026-09.md': '# My own note\n\nNothing to do with the planner.\n' });
  const plan = await P.readMonthPlan(app, TFile, DEFAULT_STORE, '2026-09');
  eq('foreign · a note without a block is an empty month', plan.entries, {});
  eq('foreign · and it is not touched by reading',
     app.text('Planner/2026-09.md'), '# My own note\n\nNothing to do with the planner.\n');
  await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-03', 'Ship 0.25');
  const text = app.text('Planner/2026-09.md');
  ok('foreign · writing appends a block instead of overwriting', text.indexOf('# My own note') === 0, text);
  ok('foreign · the block is there now', text.indexOf('```nexus-planner') > 0, text);
  ok('foreign · with a blank line between what was there and the block',
     text.indexOf('Nothing to do with the planner.\n\n```nexus-planner') > 0, JSON.stringify(text));
  eq('foreign · and holds the line',
     P.parsePlanner(P.findPlannerBlock(text).body).entries, { '2026-09-03': 'Ship 0.25' });
}

{
  // ── two blocks in one note: the first one is the plan ──
  const NOTE = [
    '```nexus-planner',
    'view: month',
    'month: 2026-09',
    '2026-09-03: first block',
    '```',
    '',
    '```nexus-planner',
    'view: month',
    'month: 2026-09',
    '2026-09-03: second block',
    '```',
  ].join('\n');
  const app = makeVault({ 'Planner/2026-09.md': NOTE });
  eq('two · the locator returns the first block', P.findPlannerBlock(NOTE).start, 0);
  const plan = await P.readMonthPlan(app, TFile, DEFAULT_STORE, '2026-09');
  eq('two · so reading gives the first block', plan.entries, { '2026-09-03': 'first block' });
  await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-03', 'edited');
  const text = app.text('Planner/2026-09.md');
  eq('two · and writing edits the first block',
     P.parsePlanner(P.findPlannerBlock(text).body).entries, { '2026-09-03': 'edited' });
  ok('two · the second block is left exactly as it was',
     text.indexOf('2026-09-03: second block') > 0, text);
}

{
  // ── merging months: a note only speaks for its own days ──
  const app = makeVault({
    'Planner/2026-08.md': '```nexus-planner\nmonth: 2026-08\n2026-08-31: last of August\n2026-09-01: typed into the wrong month\n```',
    'Planner/2026-09.md': '```nexus-planner\nmonth: 2026-09\n2026-09-01: first of September\n```',
  });
  const lines = await P.readMonthPlans(app, TFile, DEFAULT_STORE, ['2026-08', '2026-09']);
  eq('merge · a grid spanning two months reads both', lines['2026-08-31'], 'last of August');
  eq('merge · a day is read from its OWN month note', lines['2026-09-01'], 'first of September');
  eq('merge · and nothing else leaks in', Object.keys(lines).sort(), ['2026-08-31', '2026-09-01']);
}

{
  // ── a pattern with a subfolder creates the folders it needs ──
  const app = makeVault({});
  await P.writeMonthEntry(app, TFile, { folder: 'Plans', pattern: 'YYYY/MMMM' }, '2026-09', '2026-09-03', 'x');
  eq('nested · the note lands where the pattern says', app._created, ['Plans/2026/September.md']);
  eq('nested · and both folders were made', Array.from(app._folders), ['Plans', 'Plans/2026']);
}

{
  // ── a rewrite must not eat the position the other view is using ──
  const both = P.parsePlanner('view: month\nmonth: 2026-09\nweek: 2026-09-07\n2026-09-03: x');
  P.setEntry(both, '2026-09-04', 'y');
  eq('keys · a month block keeps the week it was also given',
     P.stringifyPlanner(both),
     'view: month\nmonth: 2026-09\nweek: 2026-09-07\n2026-09-03: x\n2026-09-04: y');
  const wk = P.parsePlanner('view: week\nweek: 2026-09-07\nmonth: 2026-09');
  eq('keys · and a week block keeps its month',
     P.stringifyPlanner(wk), 'view: week\nmonth: 2026-09\nweek: 2026-09-07');
  eq('keys · a block that gave only one still writes only one',
     P.stringifyPlanner(P.parsePlanner('view: month\nmonth: 2026-09')), 'view: month\nmonth: 2026-09');
  // The block fills the other field in from today before it renders; that
  // default must not become a line in the note.
  const filled = P.parsePlanner('view: month\nmonth: 2026-09');
  filled.anchor = '2026-09-15';
  eq('keys · a default the renderer filled in is not written back',
     P.stringifyPlanner(filled), 'view: month\nmonth: 2026-09');

  const app = makeVault({ 'Planner/2026-09.md': '```nexus-planner\nview: month\nmonth: 2026-09\nweek: 2026-09-07\n```' });
  await P.writeMonthEntry(app, TFile, DEFAULT_STORE, '2026-09', '2026-09-03', 'Ship');
  ok('keys · and a write through the store keeps it too',
     app.text('Planner/2026-09.md').indexOf('week: 2026-09-07') > 0, app.text('Planner/2026-09.md'));
}

{
  // ── a path is built from segments, so no slash can produce junk ──
  eq('path · a leading slash on the pattern',
     P.monthNotePath({ folder: 'Planner', pattern: '/YYYY-MM' }, '2026-09'), 'Planner/2026-09.md');
  eq('path · a trailing one does not leave an empty file name',
     P.monthNotePath({ folder: 'Planner', pattern: 'YYYY/' }, '2026-09'), 'Planner/2026.md');
  eq('path · doubled slashes collapse',
     P.monthNotePath({ folder: '/Planner//', pattern: 'YYYY//YYYY-MM' }, '2026-09'), 'Planner/2026/2026-09.md');
  eq('path · a pattern that is only a slash names no file',
     P.monthNotePath({ folder: 'Planner', pattern: '/' }, '2026-09'), '');
  eq('path · spaces around a segment are not part of it',
     P.monthNotePath({ folder: ' Planner ', pattern: 'YYYY-MM' }, '2026-09'), 'Planner/2026-09.md');

  // Not a token, so it is left as typed — the settings tab shows the result.
  eq('path · an unknown token is kept literally',
     P.monthNotePath({ folder: '', pattern: 'YYYY-MM-DD' }, '2026-09'), '2026-09-DD.md');
}

{
  // ── the range walk has to stop even where the year runs out ──
  eq('range · it stops at the end of the calendar instead of looping',
     P.monthsInRange('9999-11-01', '9999-12-31'), ['9999-11', '9999-12']);
  eq('range · a backwards range is empty', P.monthsInRange('2026-10-01', '2026-09-01'), []);
}

} catch (e) { out.push('THREW: ' + (e && e.stack || e)); fail++; }
if (window.__err && window.__err.length) out.push('LOAD ERROR: ' + window.__err.join('\n'));
out.push('');
out.push(fail === 0 ? ('ALL GREEN — ' + pass + ' checks') : (fail + ' FAILED of ' + (pass + fail)));
document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body></html>
