<!doctype html>
<html><head><meta charset="utf-8"><title>startup harness</title>
<style>
:root { --background-primary:#1e1e1e; --interactive-accent:#fb6734; }
body { margin:0; background:#141414; color:#ddd; font:13px/1.5 system-ui; padding:20px; }
</style></head><body>
<pre id="out"></pre>
<script>window.__err=[];window.onerror=(m,f,l,c,e)=>{window.__err.push(String(m)+"\n"+(e&&e.stack||""));};</script>
<script src="bundle.js"></script>
<script>
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
function eq(n, g, w) { const a = JSON.stringify(g), b = JSON.stringify(w); ok(n, a === b, 'got ' + a + ' want ' + b); }

(async () => {
try {
const Suite = window.NexusSuite;
const HOME = window.HOME_VIEW;
const makeWorkspace = window.obsidianStub.makeWorkspace;
const sleep = (ms) => new Promise(r => window.setTimeout(r, ms));

/* The plugin with a workspace and nothing else. Its settings are the real
   defaults, so a test that forgets a key still describes a real install. */
function plugin(viewTypes, homepage, pinned) {
  const workspace = makeWorkspace(viewTypes);
  const p = new Suite({ workspace, vault: {} }, {});
  p.settings = JSON.parse(JSON.stringify(window.DEFAULT_SETTINGS));
  p.settings.homepage.enabled = true;
  Object.assign(p.settings.homepage, homepage || {});
  if (pinned) p.settings.pinnedTabs = Object.assign(p.settings.pinnedTabs, pinned);
  p.workspace = workspace;
  return p;
}

/* ── The bug: the dashboard ate whatever tab was open ──────────────────────
   openHomepage handed the ACTIVE leaf to setViewState, which replaces the view
   in it. On startup that was the note the last session was left on. */
{
  const p = plugin(['markdown'], { startup: 'tab' });
  const note = p.workspace.leaves[0];
  await p.runHomepageStartup();
  eq('tab · the open note is left alone', note.stateCalls.length, 0);
  eq('tab · and still holds the note', note.viewType, 'markdown');
  eq('tab · the dashboard got a tab of its own', p.workspace.newTabs, 1);
  eq('tab · which is what the dashboard now lives in', p.workspace.getLeavesOfType(HOME).length, 1);
  eq('tab · and it was brought to the front', p.workspace.revealed.length, 1);
}

{
  // An empty tab is not a note, so taking it over costs nothing.
  const p = plugin(['empty'], { startup: 'tab' });
  const blank = p.workspace.leaves[0];
  await p.runHomepageStartup();
  eq('tab · an empty tab is reused', blank.viewType, HOME);
  eq('tab · so no second one is opened', p.workspace.newTabs, 0);
}

{
  // Already open somewhere: reveal it, do not build another.
  const p = plugin(['markdown', HOME], { startup: 'tab' });
  const note = p.workspace.leaves[0];
  const home = p.workspace.leaves[1];
  await p.runHomepageStartup();
  eq('tab · a dashboard that is already open is reused', p.workspace.getLeavesOfType(HOME).length, 1);
  eq('tab · nothing new is opened', p.workspace.newTabs, 0);
  eq('tab · nothing is overwritten', note.stateCalls.length + home.stateCalls.length, 0);
  ok('tab · the existing one is revealed', p.workspace.revealed[0] === home);
}

{
  /* Pinned: the pinned dashboard IS the leaf to bring forward. Opening a
     second one beside it is exactly what the pin exists to prevent. */
  const p = plugin([HOME, 'markdown'], { startup: 'tab' }, { home: true });
  const home = p.workspace.leaves[0];
  p.workspace.activeIndex = 1;                 // the note is the active tab
  p.applyPinnedTabs();
  ok('pinned · the dashboard leaf is pinned', home.pinned === true);
  await p.runHomepageStartup();
  ok('pinned · the pinned leaf is the one revealed', p.workspace.revealed[0] === home);
  eq('pinned · no tab is opened', p.workspace.newTabs, 0);
  eq('pinned · and the note beside it is untouched', p.workspace.leaves[1].stateCalls.length, 0);
}

{
  // closeAll: the main area is cleared BEFORE the dashboard goes up.
  const p = plugin(['markdown', 'markdown', 'pdf'], { startup: 'closeAll' });
  await p.runHomepageStartup();
  const firstOpen = p.workspace.events.findIndex(e => e.indexOf('open:') === 0);
  const lastClose = p.workspace.events.map((e, i) => e.indexOf('close:') === 0 ? i : -1).filter(i => i >= 0).pop();
  eq('closeAll · every tab was closed', p.workspace.events.filter(e => e.indexOf('close:') === 0).length, 3);
  ok('closeAll · and all of it happened before anything opened', lastClose < firstOpen,
     p.workspace.events.join(' '));
  eq('closeAll · the dashboard is what is left', p.workspace.getLeavesOfType(HOME).length, 1);
}

{
  /* A pinned Nexus page survives "close every tab": guardPinnedTabs would put
     it back 150 ms later, so closing it buys nothing but a flicker. */
  const p = plugin(['markdown', HOME], { startup: 'closeAll' }, { home: true });
  const pinnedLeaf = p.workspace.getLeavesOfType(HOME)[0];
  await p.runHomepageStartup();
  eq('closeAll · the note was closed', p.workspace.getLeavesOfType('markdown').length, 0);
  eq('closeAll · the pinned dashboard stayed, and is the only one', p.workspace.getLeavesOfType(HOME).length, 1);
  ok('closeAll · it is the same leaf, not a reopened one', p.workspace.getLeavesOfType(HOME)[0] === pinnedLeaf);
}

{
  const p = plugin(['markdown'], { startup: 'off' });
  await p.runHomepageStartup();
  eq('off · nothing happens at all', p.workspace.events.length + p.workspace.newTabs, 0);
}

{
  /* Two callers at the same instant. The check for "one is already open" and
     the setViewState that makes it true are not one step, so without a shared
     promise both get through and the vault ends up with two dashboards. */
  const p = plugin(['markdown'], { startup: 'off' });
  const slow = p.workspace.leaves[0];
  await Promise.all([p.openHomepage(), p.openHomepage(), p.openHomepage()]);
  eq('open · three callers at once open exactly one dashboard', p.workspace.getLeavesOfType(HOME).length, 1);
  eq('open · and only one new tab was taken', p.workspace.newTabs, 1);
  eq('open · the note is still a note', slow.viewType, 'markdown');
  await p.openHomepage();
  eq('open · a later call reuses it', p.workspace.newTabs, 1);
}

{
  const p = plugin(['markdown'], { startup: 'tab', enabled: false });
  p.settings.homepage.enabled = false;
  await p.runHomepageStartup();
  eq('off · a disabled module opens nothing either', p.workspace.newTabs, 0);
}

// ── The last tab closed ────────────────────────────────────────────────────
{
  const p = plugin(['empty'], { startup: 'off', openWhenEmpty: true });
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · closing the last tab brings the dashboard up', p.workspace.getLeavesOfType(HOME).length, 1);
}

{
  const p = plugin([], { startup: 'off', openWhenEmpty: true });
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · a main area with no leaf at all counts as empty', p.workspace.getLeavesOfType(HOME).length, 1);
}

{
  const p = plugin(['markdown'], { startup: 'off', openWhenEmpty: true });
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · a note still open means it is not empty', p.workspace.getLeavesOfType(HOME).length, 0);
}

{
  const p = plugin(['empty'], { startup: 'off', openWhenEmpty: false });
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · switched off, nothing happens', p.workspace.getLeavesOfType(HOME).length, 0);
}

{
  // onunload detaches the dashboard; reopening it there would undo that.
  const p = plugin(['empty'], { startup: 'off', openWhenEmpty: true });
  p._unloading = true;
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · while unloading it stays away', p.workspace.getLeavesOfType(HOME).length, 0);
}

{
  /* Opening the dashboard fires layout-change, which calls this again. Without
     the guard that is a loop that opens a tab per turn. */
  const p = plugin(['empty'], { startup: 'off', openWhenEmpty: true });
  p.maybeOpenHomepageWhenEmpty();
  p.maybeOpenHomepageWhenEmpty();
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · three events in a row still open one dashboard', p.workspace.getLeavesOfType(HOME).length, 1);
  p.maybeOpenHomepageWhenEmpty();
  await sleep(250);
  eq('empty · and the one it opened stops it from firing again', p.workspace.getLeavesOfType(HOME).length, 1);
}

{
  // The pin watchdog opens the same page; the two must not race into two tabs.
  const p = plugin(['empty'], { startup: 'off', openWhenEmpty: true }, { home: true });
  p.maybeOpenHomepageWhenEmpty();
  p.guardPinnedTabs();
  await sleep(400);
  eq('empty · the pin watchdog and this one do not open two dashboards',
     p.workspace.getLeavesOfType(HOME).length, 1);
}

// ── The removed tasksCalendar module, as an old data.json still has it ──────
{
  const loaded = async (raw, deviceId) => {
    const p = new Suite({ workspace: makeWorkspace([]), vault: {} }, {});
    p.loadData = async () => JSON.parse(JSON.stringify(raw));
    p.saveData = async () => {};
    p._deviceId = deviceId;
    await p.loadSettings();
    return p;
  };
  const oldFile = {
    tasksCalendar: { enabled: true, weekStart: '1', dayTextKey: 'focus',
      accounts: [{ id: 'acc-1', kind: 'vikunja' }], accountsBeforeDeviceStore: [{ id: 'acc-0' }],
      tasks: { projectsFolder: 'Tasks/Projects' } },
    devices: { 'dev-a': { migrated: true, taskAccounts: [{ id: 'acc-2' }], vaultSyncUrl: 'https://dav.example' } },
    pinnedTabs: { home: true, calendar: true },
    homepage: { widgets: [{ type: 'clock', uid: 'c1' }, { type: 'calendar', uid: 'k1' }, { type: 'tasks', uid: 't1' }],
      profiles: { 'dev-a': { widgets: [{ type: 'tasks', uid: 't2' }, { type: 'list', uid: 'l1' }] } } },
  };
  ['acc-0', 'acc-1', 'acc-2', 'vaultsync'].forEach(id => window.localStorage.setItem('nexus-suite-cred-' + id, '{"secret":"x"}'));
  const p = await loaded(oldFile, 'dev-a');
  const saved = JSON.parse(JSON.stringify(p.settings));
  eq('removed · the tasksCalendar key is gone after loading', saved.tasksCalendar, undefined);
  eq('removed · the week start moved to the mini calendar', p.settings.calendar.weekStart, '1');
  eq('removed · and so did the day-text key', p.settings.calendar.dayTextKey, 'focus');
  eq('removed · the per-device task accounts are gone', saved.devices['dev-a'].taskAccounts, undefined);
  eq('removed · the vault-sync connection in the same bag is not', saved.devices['dev-a'].vaultSyncUrl, 'https://dav.example');
  eq('removed · the Vikunja tokens left this device',
     ['acc-0', 'acc-1', 'acc-2'].map(id => window.localStorage.getItem('nexus-suite-cred-' + id)), [null, null, null]);
  ok('removed · the vault-sync credential stayed', window.localStorage.getItem('nexus-suite-cred-vaultsync') !== null);
  eq('removed · the calendar pin is gone, the dashboard pin is not', saved.pinnedTabs, { home: true });
  eq('removed · calendar and tasks cards left the dashboard', saved.homepage.widgets.map(w => w.uid), ['c1']);
  eq('removed · in every device profile too', saved.homepage.profiles['dev-a'].widgets.map(w => w.uid), ['l1']);
  window.localStorage.removeItem('nexus-suite-cred-vaultsync');

  const kept = await loaded({ calendar: { weekStart: '0' }, tasksCalendar: { weekStart: '1' } }, 'dev-b');
  eq('removed · a week start already saved on the calendar wins', kept.settings.calendar.weekStart, '0');
  const fresh = await loaded({}, 'dev-c');
  eq('removed · a fresh install gets the defaults', [fresh.settings.calendar.weekStart, fresh.settings.calendar.dayTextKey], ['locale', 'important']);
}

} catch (e) { out.push('THREW: ' + (e && e.stack || e)); fail++; }
if (window.__err && window.__err.length) out.push('LOAD ERROR: ' + window.__err.join('\n'));
out.push('');
out.push(fail === 0 ? ('ALL GREEN — ' + pass + ' checks') : (fail + ' FAILED of ' + (pass + fail)));
document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body></html>
