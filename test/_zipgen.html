<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="out"></pre><script src="bundle.js"></script><script>
(async () => {
  const Z = window.zipLib;
  const entries = [
    { name: 'Journal/2026-08-31.md', data: '# Today\n\nWrote the sync.\n', date: new Date(2026, 7, 31, 14, 30) },
    { name: 'Notes/Umlaute äöü ß.md', data: 'Grüße nach Köln.\n', date: new Date(2026, 7, 30, 9, 0) },
    { name: 'big.txt', data: 'repeat me. '.repeat(2000), date: new Date(2026, 7, 29) },
    { name: 'empty.md', data: '', date: new Date(2026, 7, 28) },
  ];
  const archive = await Z.zipArchive(entries);
  document.getElementById('out').textContent = btoa(Array.from(archive).map(b => String.fromCharCode(b)).join(''));
})();
</script></body></html>
