<!doctype html>
<html><head><meta charset="utf-8"><title>smoke harness</title>
<style>
body { margin:0; background:#141414; color:#ddd; font:13px/1.5 system-ui; padding:20px; }
#stage { display:none }
</style></head><body>
<div id="stage"></div>
<pre id="out"></pre>
<script>window.__err=[];window.onerror=(m,f,l,c,e)=>{window.__err.push(String(m)+"\n"+(e&&e.stack||""));};</script>
<script src="bundle.js"></script>
<script>
/* Smoke: every settings page, the add-a-server dialog and the dashboard render
   without throwing, and each puts something on screen. Nothing here checks
   what a page SAYS — the point is that splitting a 1700-line file into parts
   cannot lose a method that one page calls and no other test reaches. */
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
const errText = (e) => (e && (e.stack || e.message)) || String(e);

(async () => {
try {
const Suite = window.NexusSuite;
const stub = window.obsidianStub;

/* A vault with a handful of files and the API surface the pages read. */
function makeApp() {
  const files = ['Welcome.md', 'Projects/Alpha.md', 'Books/Dune.md'].map(path => ({
    path, name: path.split('/').pop(), basename: path.split('/').pop().replace(/\.md$/, ''),
    extension: 'md', stat: { mtime: 0, ctime: 0, size: 1 }, parent: { path: path.split('/').slice(0, -1).join('/') || '/' },
  }));
  const root = { path: '/', name: '', children: files, isRoot: () => true };
  const vault = {
    getMarkdownFiles: () => files.slice(),
    getFiles: () => files.slice(),
    getAllLoadedFiles: () => [root].concat(files),
    getAllFolders: () => [root],
    getAbstractFileByPath: (p) => files.find(f => f.path === p) || null,
    getRoot: () => root,
    read: async () => '', cachedRead: async () => '',
    getName: () => 'smoke', configDir: '.obsidian',
    adapter: { exists: async () => false, read: async () => '', write: async () => {}, list: async () => ({ files: [], folders: [] }) },
    on: () => ({}), offref: () => {},
  };
  const metadataCache = {
    getFileCache: () => ({ frontmatter: {} }), getTags: () => ({ '#a': 1 }),
    getFirstLinkpathDest: () => null, resolvedLinks: {}, unresolvedLinks: {},
    on: () => ({}), offref: () => {},
  };
  const workspace = stub.makeWorkspace(['markdown']);
  workspace.getActiveFile = () => null;
  workspace.getActiveViewOfType = () => null;
  workspace.containerEl = document.getElementById('stage').createDiv();
  return { vault, metadataCache, workspace, plugins: { plugins: {}, enabledPlugins: new Set() },
    internalPlugins: { getPluginById: () => null, plugins: {} }, setting: { open() {}, openTabById() {} },
    customCss: { themes: {}, theme: '', snippets: [] }, commands: { commands: {} }, isMobile: false };
}

function makePlugin() {
  const app = makeApp();
  const p = new Suite(app, { id: 'nexus-suite', dir: '.obsidian/plugins/nexus-suite', version: '0.0.0' });
  p.settings = JSON.parse(JSON.stringify(window.DEFAULT_SETTINGS));
  p.saveSettings = async () => {};
  p.saveData = async () => {};
  return p;
}

// ── every settings page ────────────────────────────────────────────────────
{
  const p = makePlugin();
  const SettingsTab = window.NexusSettingsTab;
  const tab = new SettingsTab(p.app, p);
  document.getElementById('stage').appendChild(tab.containerEl);
  // Learn the ids from the page itself, so a new tab is covered without an edit here.
  tab.display();
  const ids = Array.from(tab.containerEl.querySelectorAll('.nx-settings-tab[data-id]')).map(el => el.getAttribute('data-id'));
  ok('settings · the nav lists the pages', ids.length >= 20, 'found ' + ids.length);
  for (const id of ids) {
    tab.active = id;
    let err = null;
    try { tab.display(); } catch (e) { err = e; }
    const body = tab.containerEl.querySelector('.nx-settings-body');
    ok('settings · ' + id + ' renders', !err, errText(err));
    ok('settings · ' + id + ' shows something', !!body && body.querySelectorAll('.setting-item, p, .nx-row').length > 0);
  }
}

// ── the narrow layout: a page picker instead of the rail ───────────────────
/* The switch is measured on the tab, not on the window: the same 1000px
   window shows the rail in a wide tab and the picker in a 420px one — the
   width left in a ~680px window once Obsidian's own sidebar is drawn. */
{
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'plugin/styles.css';
  await new Promise(res => { css.onload = css.onerror = res; document.head.appendChild(css); });
  const p = makePlugin();
  const SettingsTab = window.NexusSettingsTab;
  const mount = (width, active) => {
    const host = document.body.createDiv();
    host.style.width = width + 'px';
    const tab = new SettingsTab(p.app, p);
    tab.active = active;
    host.appendChild(tab.containerEl);
    tab.display();
    return { host, tab, q: (sel) => tab.containerEl.querySelector(sel) };
  };
  const shown = (el) => !!el && getComputedStyle(el).display !== 'none';

  const wide = mount(1000, 'vaultSync');
  ok('settings narrow · a wide tab shows the rail', shown(wide.q('.nx-settings-nav')));
  ok('settings narrow · and no picker', !shown(wide.q('.nx-settings-pick')));

  const slim = mount(420, 'vaultSync');
  ok('settings narrow · a 420px tab hides the rail', !shown(slim.q('.nx-settings-nav')));
  ok('settings narrow · and shows the picker', shown(slim.q('.nx-settings-pick')));
  const select = slim.q('.nx-settings-pick-select');
  const navIds = Array.from(slim.tab.containerEl.querySelectorAll('.nx-settings-tab[data-id]')).map(el => el.getAttribute('data-id'));
  const optIds = Array.from(select.querySelectorAll('option')).map(o => o.value);
  ok('settings narrow · the picker offers every page, in nav order', JSON.stringify(optIds) === JSON.stringify(navIds), optIds.join(','));
  ok('settings narrow · grouped like the nav', select.querySelectorAll('optgroup').length === slim.tab.containerEl.querySelectorAll('.nx-settings-navgroup').length);
  ok('settings narrow · shows the open page', select.value === 'vaultSync', select.value);
  const body = slim.q('.nx-settings-body');
  ok('settings narrow · the page gets the full width', body.getBoundingClientRect().width > 380, body.getBoundingClientRect().width);
  const fieldRow = (root) => Array.from(root.querySelectorAll('.setting-item'))
    .find(r => !r.querySelector('.checkbox-container') && r.querySelector('.setting-item-control input, .setting-item-control select, .setting-item-control textarea'));
  const row = fieldRow(body);
  ok('settings narrow · a row with a field stacks', !!row && getComputedStyle(row).flexDirection === 'column', row && getComputedStyle(row).flexDirection);
  const wideRow = fieldRow(wide.q('.nx-settings-body'));
  ok('settings narrow · but not in a wide tab', !!wideRow && getComputedStyle(wideRow).flexDirection !== 'column');

  select.value = 'banner'; select.dispatchEvent(new Event('change'));
  ok('settings narrow · picking a page opens it', slim.tab.active === 'banner' && /Banner/i.test(slim.q('.nx-settings-head').textContent), slim.tab.active);
  ok('settings narrow · the rail follows', slim.q('.nx-settings-tab.is-active').getAttribute('data-id') === 'banner');
  const [prev, next] = slim.tab.containerEl.querySelectorAll('.nx-settings-pick-step');
  const i = navIds.indexOf('banner');
  next.click();
  ok('settings narrow · › steps to the next page', slim.tab.active === navIds[i + 1] && select.value === navIds[i + 1], slim.tab.active);
  slim.tab.active = navIds[0]; slim.tab.display();
  slim.tab.containerEl.querySelector('.nx-settings-pick-step').click();
  ok('settings narrow · ‹ on the first page wraps to the last', slim.tab.active === navIds[navIds.length - 1], slim.tab.active);
  // Between the two thresholds: the picker is up, but the rows still have room.
  const mid = mount(560, 'vaultSync');
  ok('settings narrow · a 560px tab uses the picker', shown(mid.q('.nx-settings-pick')) && !shown(mid.q('.nx-settings-nav')));
  const midRow = fieldRow(mid.q('.nx-settings-body'));
  ok('settings narrow · and keeps rows side by side', !!midRow && getComputedStyle(midRow).flexDirection !== 'column');
  // The rail + page fill the shell under the picker instead of overflowing it.
  const shellBox = mid.q('.nx-settings-shell').getBoundingClientRect(), pageBox = mid.q('.nx-settings').getBoundingClientRect();
  ok('settings narrow · the page ends inside the shell', pageBox.bottom <= shellBox.bottom + 1, pageBox.bottom + ' > ' + shellBox.bottom);
  wide.host.remove(); slim.host.remove(); mid.host.remove();

  // Desktop dialog: the page uses the dialog's height and grows past
  // Obsidian's 700px reading column, up to 1100px.
  {
    const modal = document.body.createDiv();
    modal.className = 'modal mod-settings';
    modal.style.cssText = 'width:1500px;height:1000px;display:flex';
    const tab = new SettingsTab(p.app, p);
    tab.active = 'vaultSync';
    tab.containerEl.classList.add('vertical-tab-content');
    tab.containerEl.style.cssText = 'flex:1;height:100%;overflow-y:auto;box-sizing:border-box';
    modal.appendChild(tab.containerEl);
    tab.display();
    const shell = tab.containerEl.querySelector('.nx-settings-shell').getBoundingClientRect();
    ok('settings dialog · the page fills the dialog height', shell.height > 900, shell.height);
    ok('settings dialog · and is 1100px wide, not 700', Math.round(shell.width) === 1100, shell.width);
    ok('settings dialog · nothing spills over', tab.containerEl.scrollHeight <= tab.containerEl.clientHeight + 1, tab.containerEl.scrollHeight + '/' + tab.containerEl.clientHeight);
    modal.remove();
  }
}

// ── the add-a-server dialog ────────────────────────────────────────────────
{
  const p = makePlugin();
  const { NexusAccountModal } = window.accountModal;
  let err = null; const m = new NexusAccountModal(p, () => {});
  try { m.open(); } catch (e) { err = e; }
  ok('account · opens', !err, errText(err));
  const foot = m.contentEl.querySelector('.nx-account-foot');
  ok('account · has its footer with Save', !!foot && /Save/.test(foot.textContent));
}

// ── the dashboard ──────────────────────────────────────────────────────────
{
  const p = makePlugin();
  p.settings.homepage.enabled = true;
  const leaf = p.app.workspace.leaves[0];
  leaf.app = p.app;
  const View = window.NexusHomepageView;
  const v = new View(leaf, p);
  document.getElementById('stage').appendChild(v.containerEl);
  let err = null;
  try { await v.onOpen(); } catch (e) { err = e; }
  ok('dashboard · renders', !err, errText(err));
  ok('dashboard · draws widgets', v.contentEl.querySelectorAll('*').length > 10);
}

} catch (e) { fail++; out.push('FAIL  threw: ' + errText(e)); }
if (window.__err.length) { fail++; out.push('FAIL  page errors:\n' + window.__err.join('\n')); }
out.push('');
out.push(fail ? (fail + ' FAILED, ' + pass + ' passed') : ('ALL GREEN — ' + pass + ' checks'));
document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body></html>
