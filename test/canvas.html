<!doctype html>
<html><head><meta charset="utf-8"><title>canvas harness</title>
<style>
:root { --background-primary:#1e1e1e; --background-secondary:#252525;
  --background-modifier-border:#3a3a3a; --interactive-accent:#fb6734; --text-muted:#999; }
body { margin:0; background:#141414; color:#ddd; font:13px/1.5 system-ui; padding:20px; }
#stage { width: 800px; }
.svg-icon { display:block; width:17px; height:17px; }
</style></head><body>
<div id="stage"></div><pre id="out"></pre>
<script>window.__err=[];window.onerror=(m,f,l,c,e)=>{window.__err.push(String(m)+"\n"+(e&&e.stack||""));};</script>
<script src="bundle.js"></script>
<script>
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
function eq(n, g, w) { const a = JSON.stringify(g), b = JSON.stringify(w); ok(n, a === b, 'got ' + a + ' want ' + b); }
function near(n, g, w, tol) { ok(n, Math.abs(g - w) <= (tol == null ? 0.6 : tol), 'got ' + g + ' want ~' + w); }

try {
const C = window.sketchCanvas;

// ── fling ──────────────────────────────────────────────────────────────────
{
  // 100 px over 100 ms = 1 px/ms.
  const samples = [{ t: 0, x: 0, y: 0 }, { t: 50, x: 0, y: 50 }, { t: 100, x: 0, y: 100 }];
  near('fling · velocity from the drag', C.flingVelocity(samples, 'y'), 1, 0.01);
  eq('fling · a single sample cannot throw anything', C.flingVelocity([{ t: 0, x: 0, y: 0 }], 'y'), 0);
  eq('fling · two samples at the same instant do not divide by zero',
     C.flingVelocity([{ t: 5, x: 0, y: 0 }, { t: 5, x: 0, y: 90 }], 'y'), 0);

  // Only the tail counts: a long slow drag that ends in a flick throws fast.
  const flick = [{ t: 0, x: 0, y: 0 }, { t: 900, x: 0, y: 10 }, { t: 950, x: 0, y: 110 }];
  ok('fling · only the tail of the drag decides the throw', C.flingVelocity(flick, 'y') > 1.5,
     'got ' + C.flingVelocity(flick, 'y'));

  // A jitter spike must not launch the page across the note.
  const spike = [{ t: 0, x: 0, y: 0 }, { t: 1, x: 0, y: 9999 }];
  ok('fling · velocity is capped', Math.abs(C.flingVelocity(spike, 'y')) <= C.FLING_MAX_V);

  const step = C.flingStep(1, 16);
  near('fling · one frame moves velocity times dt', step.move, 16, 0.01);
  ok('fling · and slows down', step.v < 1 && step.v > 0.9, 'v ' + step.v);
  eq('fling · a crawl is stopped rather than crawling forever', C.flingStep(0.001, 16).v, 0);

  // It has to actually come to rest, not asymptote for ever.
  let v = C.FLING_MAX_V, frames = 0, travelled = 0;
  while (v && frames < 100000) { const s = C.flingStep(v, 16); travelled += s.move; v = s.v; frames++; }
  ok('fling · always reaches a stop', v === 0 && frames < 1000, 'frames ' + frames);
  ok('fling · and travels a sane distance', Math.abs(travelled) > 100 && Math.abs(travelled) < 40000,
     'travelled ' + Math.round(travelled));
}

// ── vertical space ─────────────────────────────────────────────────────────
{
  const strokes = [
    { points: [[0, 10, .5], [10, 20, .5]] },     // fully above the line
    { points: [[0, 60, .5], [10, 70, .5]] },     // fully below
    { points: [[0, 40, .5], [10, 80, .5]] },     // straddles it
  ];
  eq('space · only what starts below the line moves', C.strokesBelow(strokes, 50), [1]);
  eq('space · a line above everything moves it all', C.strokesBelow(strokes, 0), [0, 1, 2]);
  eq('space · a line below everything moves nothing', C.strokesBelow(strokes, 999), []);

  eq('space · opening a gap is never clamped', C.clampSpaceDelta(strokes, 50, 30), 30);
  // The nearest content below sits at y=60, so it can rise by 10 and no more.
  eq('space · closing one stops at the line', C.clampSpaceDelta(strokes, 50, -40), -10);
  eq('space · a smaller close is left alone', C.clampSpaceDelta(strokes, 50, -5), -5);
  eq('space · with nothing below, closing is free', C.clampSpaceDelta(strokes, 999, -40), -40);
}

// ── sheet width ────────────────────────────────────────────────────────────
{
  eq('width · the cap applies when the pane is wider', C.resolvePaperWidth(1600, 1100), 1100);
  eq('width · a narrow pane is left alone', C.resolvePaperWidth(700, 1100), 700);
  eq('width · zero means fill', C.resolvePaperWidth(1600, 0), 1600);
}

// ── the surface, end to end ────────────────────────────────────────────────
function makeSurface(strokes, opts) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const pad = stage.createDiv('nx-sketch-pad');
  pad.style.width = '800px';
  const s = new window.NexusSketchSurface(pad, Object.assign({ W: 800, H: 400, strokes: strokes || [] }, opts || {}));
  s._invCTM = () => null;
  s._pt = (e) => ({ x: e.__x, y: e.__y });
  s._uPerPx = () => 1;
  return s;
}
function ptr(surface, type, x, y) {
  const e = new PointerEvent(type, { bubbles: true, pointerId: 1, pointerType: 'mouse', button: 0 });
  e.__x = x; e.__y = y;
  if (type === 'pointerdown') surface._onDown(e);
  else if (type === 'pointermove') surface._onMove(e);
  else surface._onUp(e);
}
function drag(s, path) {
  ptr(s, 'pointerdown', path[0][0], path[0][1]);
  for (let i = 1; i < path.length; i++) ptr(s, 'pointermove', path[i][0], path[i][1]);
  ptr(s, 'pointerup', path[path.length - 1][0], path[path.length - 1][1]);
}
function stroke(pts) {
  return { color: '#111111', size: 3, thinning: 0, taper: 0, opacity: 1, pen: 'fountain', cap: 'round', points: pts };
}

{
  const s = makeSurface([
    stroke([[100, 50, .5], [200, 60, .5]]),     // above the line
    stroke([[100, 200, .5], [200, 210, .5]]),   // below it
  ]);
  s.setMode('space');
  ok('spacing · the pad says which tool is armed', s.host.classList.contains('is-space'));
  const h0 = s.H;
  drag(s, [[400, 120], [400, 160], [400, 220]]);
  eq('spacing · the stroke below moved down by the drag', s.strokes[1].points[0][1], 300);
  eq('spacing · the one above stayed', s.strokes[0].points[0][1], 50);
  ok('spacing · the paper grew with the gap', s.H > h0, 'H ' + s.H + ' was ' + h0);
  s.undo();
  eq('spacing · undo puts the ink back', s.strokes[1].points[0][1], 200);
  eq('spacing · and the paper back', s.H, h0);
  s.redo();
  eq('spacing · redo opens the gap again', s.strokes[1].points[0][1], 300);
}

{
  // Pulling up can close a gap, but not drag content through the line.
  const s = makeSurface([stroke([[100, 200, .5], [200, 210, .5]])]);
  s.setMode('space');
  drag(s, [[400, 150], [400, 100], [400, 20]]);
  eq('spacing · closing stops where the content meets the line', s.strokes[0].points[0][1], 150);
}

{
  // A tap with no movement must not write an undo entry.
  const s = makeSurface([stroke([[100, 200, .5], [200, 210, .5]])]);
  s.setMode('space');
  const before = s.undoStack.length;
  drag(s, [[400, 150], [400, 150]]);
  eq('spacing · a tap changes nothing', s.undoStack.length, before);
}

{
  // Two fingers moving apart is a pinch, and a pinch is a zoom — the reported
  // bug was a gate in front of this that a whole surface kind never got past.
  const s = makeSurface([], { pageZoom: true });
  s._touches = new Map([[1, { x: 100, y: 100 }], [2, { x: 200, y: 100 }]]);
  s._gestMode = 'pending';
  s._pending = { d: 100, cx: 150, cy: 100 };
  s._touches.set(2, { x: 260, y: 100 });   // pinch open by 60px
  s._applyGesture();
  eq('zoom · fingers moving apart enter the pinch', s._gestMode, 'zoom');

  // …and two fingers travelling together is the page scrolling, not a zoom.
  const pan = makeSurface([], { pageZoom: true });
  pan._touches = new Map([[1, { x: 100, y: 100 }], [2, { x: 200, y: 100 }]]);
  pan._gestMode = 'pending';
  pan._pending = { d: 100, cx: 150, cy: 100 };
  pan._touches.set(1, { x: 100, y: 160 });
  pan._touches.set(2, { x: 200, y: 160 });
  pan._applyGesture();
  eq('zoom · two fingers moving together scroll instead', pan._gestMode, 'scroll');
}

{
  // Zooming out past 1 is what gives an endless page an overview.
  const s = makeSurface([], { pageZoom: true });
  s.setPageZoom(0.5);
  near('zoom · out below 1 is allowed now', s.getPageZoom(), 0.5, 0.001);
  s.setPageZoom(0.01);
  near('zoom · but not to nothing', s.getPageZoom(), 0.3, 0.001);
  s.setPageZoom(99);
  near('zoom · and not past the ceiling', s.getPageZoom(), 5, 0.001);
  let fired = 0;
  s.onZoom = () => fired++;
  s.setPageZoom(1);
  eq('zoom · returning to 1 reports the change', fired, 1);
  s.setPageZoom(1);
  eq('zoom · setting the same level again reports nothing', fired, 1);
}

{
  // The width cap is what keeps portrait and landscape the same size.
  const s = makeSurface([], { paperWidth: 900 });
  eq('width · the cap is on the pad', s.host.style.maxWidth, '900px');
  ok('width · and it is centred', s.host.style.marginInline === 'auto');
  s.setPaperWidth(0);
  eq('width · zero clears it', s.host.style.maxWidth, '');
}

} catch (e) { out.push('THREW: ' + (e && e.stack || e)); fail++; }

/* ── Finger taps ───────────────────────────────────────────────────────────
   The engine sees taps as pointer events, so they are driven as pointer events
   here: down/up with no travel in between. `wait` is real time; the page is
   rendered with a virtual-time budget, so the multi-tap window actually
   elapses instead of being skipped. */
function tap(s, fingers, x, y) {
  const ids = [];
  for (let i = 0; i < fingers; i++) {
    const id = 100 + i;
    ids.push(id);
    const e = new PointerEvent('pointerdown', { bubbles: true, pointerId: id, pointerType: 'touch' });
    Object.defineProperty(e, 'clientX', { value: (x || 100) + i * 30 });
    Object.defineProperty(e, 'clientY', { value: y || 100 });
    s._onDown(e);
  }
  for (const id of ids) {
    const e = new PointerEvent('pointerup', { bubbles: true, pointerId: id, pointerType: 'touch' });
    s._onUp(e);
  }
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const MULTI_WAIT = 600;   // comfortably past the engine's multi-tap window

/* A surface with real undo history: the initial `strokes` option is the state
   BEFORE the first edit, so there is nothing to undo about it. */
function drawn(count, opts) {
  const s = makeSurface([], opts);
  for (let i = 0; i < count; i++) drag(s, [[100, 40 + i * 60], [160, 60 + i * 60], [220, 40 + i * 60]]);
  return s;
}

async function tapTests() {
  {
    // Three fingers is the way out of any zoom where the OS lets three through.
    const s = makeSurface([], { pageZoom: true });
    s.setPageZoom(2.5);
    tap(s, 3);
    near('tap · three fingers put the sheet back to page width', s.getPageZoom(), 1, 0.001);
  }
  {
    /* The one that has to work on a tablet: three simultaneous touches are a
       system gesture on a lot of Android devices and never reach the page. */
    const s = makeSurface([], { pageZoom: true });
    s.setPageZoom(3);
    tap(s, 2);
    near('tap · a single two-finger tap is where a pinch rests, so it does nothing',
         s.getPageZoom(), 3, 0.001);
    tap(s, 2);
    near('tap · two fingers twice put the sheet back to page width', s.getPageZoom(), 1, 0.001);
    const flash = s.host.querySelector('.nx-sk-tapflash');
    eq('tap · and it says so even at 1x, so "seen" and "did nothing" differ',
       flash && flash.textContent, 'Page width');
  }
  {
    // One finger then two is two gestures, not a double tap.
    const s = drawn(1, { pageZoom: true });
    s.setPageZoom(2);
    tap(s, 1);
    tap(s, 2);
    await wait(MULTI_WAIT);
    near('tap · a run needs the same number of fingers', s.getPageZoom(), 2, 0.001);
    eq('tap · and the odd one out undid nothing', s.strokes.length, 1);
  }
  {
    // Zoom reset is navigation, not editing: it works in view mode too.
    const s = makeSurface([], { pageZoom: true, locked: true });
    s.setPageZoom(2);
    tap(s, 2); tap(s, 2);
    near('tap · two fingers still reset a locked surface', s.getPageZoom(), 1, 0.001);
  }
  {
    const s = drawn(1);
    tap(s, 1);
    tap(s, 1);
    eq('tap · undo waits out the multi-tap window', s.strokes.length, 1);
    await wait(MULTI_WAIT);
    eq('tap · then a double tap undoes', s.strokes.length, 0);
  }
  {
    // Two strokes, one undone: a triple tap must land on 2, not on 0-then-1 —
    // which is what would happen if the double tap's undo fired on the way.
    const s = drawn(2);
    s.undo();
    tap(s, 1); tap(s, 1); tap(s, 1);
    eq('tap · a triple tap redoes instead of undoing on its way there', s.strokes.length, 2);
    await wait(MULTI_WAIT);
    eq('tap · and the pending undo was cancelled, not merely delayed', s.strokes.length, 2);
  }
  {
    // A drag is not a tap, or scrolling the page would undo the drawing.
    const s = drawn(1);
    for (let round = 0; round < 2; round++) {
      const down = new PointerEvent('pointerdown', { bubbles: true, pointerId: 7, pointerType: 'touch' });
      Object.defineProperty(down, 'clientX', { value: 100 });
      Object.defineProperty(down, 'clientY', { value: 100 });
      s._onDown(down);
      const move = new PointerEvent('pointermove', { bubbles: true, pointerId: 7, pointerType: 'touch' });
      Object.defineProperty(move, 'clientX', { value: 100 });
      Object.defineProperty(move, 'clientY', { value: 260 });
      s._onMove(move);
      s._onUp(new PointerEvent('pointerup', { bubbles: true, pointerId: 7, pointerType: 'touch' }));
    }
    await wait(MULTI_WAIT);
    eq('tap · a drag is never a tap', s.strokes.length, 1);
  }
  {
    // A palm landing while the pen writes must not undo the sentence.
    const s = drawn(1);
    s._lastPen = performance.now();
    tap(s, 1); tap(s, 1);
    await wait(MULTI_WAIT);
    eq('tap · a touch right after the pen is a palm, not a tap', s.strokes.length, 1);
  }
  {
    /* The reported regression: on a pen tablet the pen HOVERS over the glass the
       whole time, and palm rejection counted hover — so no finger tap ever got
       through. Contact opens the window, hover does not. */
    const s = drawn(1);
    const hover = new PointerEvent('pointermove', { bubbles: true, pointerId: 9, pointerType: 'pen', buttons: 0, pressure: 0 });
    s._onMove(hover);
    ok('tap · a hovering pen does not open the palm window', s._lastPen === -Infinity, 'lastPen ' + s._lastPen);
    tap(s, 1); tap(s, 1);
    await wait(MULTI_WAIT);
    eq('tap · so a tap while the pen hovers still undoes', s.strokes.length, 0);

    // …but the nib touching down does open it.
    const contact = new PointerEvent('pointermove', { bubbles: true, pointerId: 9, pointerType: 'pen', buttons: 1, pressure: 0.5 });
    s._onMove(contact);
    ok('tap · a pen in contact does open it', s._lastPen > 0, 'lastPen ' + s._lastPen);
  }
  {
    // A three-finger tap is six events with a hand between them — the first
    // thresholds were mouse-tight and missed real taps.
    const s = makeSurface([], { pageZoom: true });
    s.setPageZoom(3);
    tap(s, 3);
    near('tap · a three-finger tap reports what it did', s.getPageZoom(), 1, 0.001);
    const flash = s.host.querySelector('.nx-sk-tapflash');
    ok('tap · and says so on the pad', !!flash && flash.textContent === 'Page width',
       flash ? flash.textContent : 'no flash element');
  }
  {
    // View mode: the drawing is read-only, so a stray tap must not edit it.
    const s = drawn(1, { pageZoom: true });
    s.setLocked(true);
    tap(s, 1); tap(s, 1);
    await wait(MULTI_WAIT);
    eq('tap · a locked surface is not undone by a double tap', s.strokes.length, 1);
    // …but coming back to page width has to work even there.
    s.setPageZoom(2);
    tap(s, 3);
    near('tap · three fingers still work while locked', s.getPageZoom(), 1, 0.001);
  }

  /* ── Sideways: the page turn ──────────────────────────────────────────── */
  async function throwFinger(s, dx, dy, ms) {
    const down = new PointerEvent('pointerdown', { bubbles: true, pointerId: 21, pointerType: 'touch' });
    Object.defineProperty(down, 'clientX', { value: 200 });
    Object.defineProperty(down, 'clientY', { value: 300 });
    s._onDown(down);
    const steps = 4;
    for (let i = 1; i <= steps; i++) {
      const move = new PointerEvent('pointermove', { bubbles: true, pointerId: 21, pointerType: 'touch' });
      Object.defineProperty(move, 'clientX', { value: 200 + dx * i / steps });
      Object.defineProperty(move, 'clientY', { value: 300 + dy * i / steps });
      s._onMove(move);
    }
    if (ms) await wait(ms);   // a busy-wait would stop virtual time, not the drag
    s._onUp(new PointerEvent('pointerup', { bubbles: true, pointerId: 21, pointerType: 'touch' }));
  }
  {
    const s = makeSurface([], { pageZoom: true });
    const seen = [];
    s.onSwipe = (dir) => seen.push(dir);
    await throwFinger(s, -160, 10);
    eq('swipe · thrown left is the next page', seen, ['next']);
    await throwFinger(s, 160, -10);
    eq('swipe · thrown right is the previous one', seen, ['next', 'prev']);
  }
  {
    // Everything the gesture must NOT be.
    const s = makeSurface([], { pageZoom: true });
    const seen = [];
    s.onSwipe = (dir) => seen.push(dir);
    await throwFinger(s, -40, 0);
    eq('swipe · a short drag is not a swipe', seen, []);
    await throwFinger(s, -160, 200);
    eq('swipe · a diagonal one is scrolling', seen, []);
    await throwFinger(s, 0, -300);
    eq('swipe · and scrolling the page is never a page turn', seen, []);
    await throwFinger(s, -160, 0, 700);
    eq('swipe · a slow drag is not a throw', seen, []);
  }
  {
    // Zoomed in, sideways is how you look around the sheet.
    const s = makeSurface([], { pageZoom: true });
    const seen = [];
    s.onSwipe = (dir) => seen.push(dir);
    s.setPageZoom(2);
    await throwFinger(s, -160, 0);
    eq('swipe · zoomed in it stays a pan', seen, []);
    s.setPageZoom(1);
    await throwFinger(s, -160, 0);
    eq('swipe · and comes back at page width', seen, ['next']);
  }
  {
    // Two fingers is the page scroll, not a page turn.
    const s = makeSurface([], { pageZoom: true });
    const seen = [];
    s.onSwipe = (dir) => seen.push(dir);
    const ids = [31, 32];
    ids.forEach((id, i) => {
      const e = new PointerEvent('pointerdown', { bubbles: true, pointerId: id, pointerType: 'touch' });
      Object.defineProperty(e, 'clientX', { value: 200 + i * 40 });
      Object.defineProperty(e, 'clientY', { value: 300 });
      s._onDown(e);
    });
    ids.forEach((id, i) => {
      const e = new PointerEvent('pointermove', { bubbles: true, pointerId: id, pointerType: 'touch' });
      Object.defineProperty(e, 'clientX', { value: 40 + i * 40 });
      Object.defineProperty(e, 'clientY', { value: 300 });
      s._onMove(e);
    });
    ids.forEach(id => s._onUp(new PointerEvent('pointerup', { bubbles: true, pointerId: id, pointerType: 'touch' })));
    eq('swipe · two fingers are not a page turn', seen, []);
  }
  {
    // A surface nobody wired must not blow up on a swipe.
    const s = makeSurface([], { pageZoom: true });
    await throwFinger(s, -160, 0);
    ok('swipe · a surface with no handler ignores it', true);
  }
  {
    // ctrl+wheel is the desktop's pinch; a plain wheel belongs to the page.
    const s = makeSurface([], { pageZoom: true });
    s.svg.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: -300 }));
    near('wheel · a plain wheel is left to the page', s.getPageZoom(), 1, 0.001);
    s.svg.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: -300, ctrlKey: true }));
    ok('wheel · ctrl + wheel zooms in', s.getPageZoom() > 1.1, 'got ' + s.getPageZoom());
    s.svg.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: 300, ctrlKey: true }));
    near('wheel · and back out again', s.getPageZoom(), 1, 0.02);
  }
  {
    // A new note’s sidecar is written before anything is drawn on it, so the
    // Sketch tab opens on a real file instead of on "not found".
    const back = window.parseSketchSVG(window.emptySketchSVG());
    ok('empty sidecar · parses back', !!back, 'got ' + back);
    eq('empty sidecar · with no strokes in it', back.strokes.length, 0);
    ok('empty sidecar · and a usable page size', back.w > 0 && back.h > 0, back.w + 'x' + back.h);
  }
}


const finish = () => {
  if (window.__err && window.__err.length) out.push('LOAD ERROR: ' + window.__err.join('\n'));
  out.push('');
  out.push(fail === 0 ? ('ALL GREEN — ' + pass + ' checks') : (fail + ' FAILED of ' + (pass + fail)));
  document.getElementById('out').textContent = out.join('\n');
};
tapTests().catch(e => { out.push('THREW: ' + (e && e.stack || e)); fail++; }).then(finish);
</script>
</body></html>
