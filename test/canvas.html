<!doctype html>
<html><head><meta charset="utf-8"><title>canvas harness</title>
<style>
:root { --background-primary:#1e1e1e; --background-secondary:#252525;
  --background-modifier-border:#3a3a3a; --interactive-accent:#fb6734; --text-muted:#999; }
body { margin:0; background:#141414; color:#ddd; font:13px/1.5 system-ui; padding:20px; }
#stage { width: 800px; }
.svg-icon { display:block; width:17px; height:17px; }
</style></head><body>
<div id="stage"></div><pre id="out"></pre>
<script>window.__err=[];window.onerror=(m,f,l,c,e)=>{window.__err.push(String(m)+"\n"+(e&&e.stack||""));};</script>
<script src="bundle.js"></script>
<script>
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
function eq(n, g, w) { const a = JSON.stringify(g), b = JSON.stringify(w); ok(n, a === b, 'got ' + a + ' want ' + b); }
function near(n, g, w, tol) { ok(n, Math.abs(g - w) <= (tol == null ? 0.6 : tol), 'got ' + g + ' want ~' + w); }

try {
const C = window.sketchCanvas;

// ── fling ──────────────────────────────────────────────────────────────────
{
  // 100 px over 100 ms = 1 px/ms.
  const samples = [{ t: 0, x: 0, y: 0 }, { t: 50, x: 0, y: 50 }, { t: 100, x: 0, y: 100 }];
  near('fling · velocity from the drag', C.flingVelocity(samples, 'y'), 1, 0.01);
  eq('fling · a single sample cannot throw anything', C.flingVelocity([{ t: 0, x: 0, y: 0 }], 'y'), 0);
  eq('fling · two samples at the same instant do not divide by zero',
     C.flingVelocity([{ t: 5, x: 0, y: 0 }, { t: 5, x: 0, y: 90 }], 'y'), 0);

  // Only the tail counts: a long slow drag that ends in a flick throws fast.
  const flick = [{ t: 0, x: 0, y: 0 }, { t: 900, x: 0, y: 10 }, { t: 950, x: 0, y: 110 }];
  ok('fling · only the tail of the drag decides the throw', C.flingVelocity(flick, 'y') > 1.5,
     'got ' + C.flingVelocity(flick, 'y'));

  // A jitter spike must not launch the page across the note.
  const spike = [{ t: 0, x: 0, y: 0 }, { t: 1, x: 0, y: 9999 }];
  ok('fling · velocity is capped', Math.abs(C.flingVelocity(spike, 'y')) <= C.FLING_MAX_V);

  const step = C.flingStep(1, 16);
  near('fling · one frame moves velocity times dt', step.move, 16, 0.01);
  ok('fling · and slows down', step.v < 1 && step.v > 0.9, 'v ' + step.v);
  eq('fling · a crawl is stopped rather than crawling forever', C.flingStep(0.001, 16).v, 0);

  // It has to actually come to rest, not asymptote for ever.
  let v = C.FLING_MAX_V, frames = 0, travelled = 0;
  while (v && frames < 100000) { const s = C.flingStep(v, 16); travelled += s.move; v = s.v; frames++; }
  ok('fling · always reaches a stop', v === 0 && frames < 1000, 'frames ' + frames);
  ok('fling · and travels a sane distance', Math.abs(travelled) > 100 && Math.abs(travelled) < 40000,
     'travelled ' + Math.round(travelled));
}

// ── vertical space ─────────────────────────────────────────────────────────
{
  const strokes = [
    { points: [[0, 10, .5], [10, 20, .5]] },     // fully above the line
    { points: [[0, 60, .5], [10, 70, .5]] },     // fully below
    { points: [[0, 40, .5], [10, 80, .5]] },     // straddles it
  ];
  eq('space · only what starts below the line moves', C.strokesBelow(strokes, 50), [1]);
  eq('space · a line above everything moves it all', C.strokesBelow(strokes, 0), [0, 1, 2]);
  eq('space · a line below everything moves nothing', C.strokesBelow(strokes, 999), []);

  eq('space · opening a gap is never clamped', C.clampSpaceDelta(strokes, 50, 30), 30);
  // The nearest content below sits at y=60, so it can rise by 10 and no more.
  eq('space · closing one stops at the line', C.clampSpaceDelta(strokes, 50, -40), -10);
  eq('space · a smaller close is left alone', C.clampSpaceDelta(strokes, 50, -5), -5);
  eq('space · with nothing below, closing is free', C.clampSpaceDelta(strokes, 999, -40), -40);
}

// ── sheet width ────────────────────────────────────────────────────────────
{
  eq('width · the cap applies when the pane is wider', C.resolvePaperWidth(1600, 1100), 1100);
  eq('width · a narrow pane is left alone', C.resolvePaperWidth(700, 1100), 700);
  eq('width · zero means fill', C.resolvePaperWidth(1600, 0), 1600);
}

// ── paper type: A4 pages, and the camera over a plane ──────────────────────
{
  const W = 1600;
  const gap = C.sheetGap(W);
  const hP = C.sheetHeight(W, false), hL = C.sheetHeight(W, true);
  ok('sheet · a portrait page is taller than it is wide', hP > W, 'h ' + hP);
  ok('sheet · and a landscape one is not', hL < W, 'h ' + hL);
  near('sheet · portrait is A4', hP / W, 297 / 210, 0.005);
  near('sheet · landscape is the same paper turned', hL / W, 210 / 297, 0.005);
  ok('sheet · the gap is small but visible', gap > 2 && gap < W / 20, 'gap ' + gap);

  eq('sheet · blank paper is still one sheet', C.sheetPages(W, 0, false).length, 1);
  eq('sheet · and so is half a sheet of content', C.sheetPages(W, Math.round(hP / 2), false).length, 1);
  eq('sheet · one unit past the page edge starts a second', C.sheetPages(W, hP + gap + 1, false).length, 2);
  const pages = C.sheetPages(W, hP * 2 + gap, false);
  eq('sheet · two pages are two pages', pages.length, 2);
  eq('sheet · the second starts a whole pitch down', pages[1].y, hP + gap);
  eq('sheet · and both are the same size', pages[0].h, pages[1].h);

  // The bottom of sectioned paper is always a page edge — half a sheet is not
  // something anyone can print.
  eq('sheet · a height in the middle of a page is rounded up to its edge',
     C.snapSheetHeight(W, hP - 10, false), hP);
  eq('sheet · a height in the gap grows to the next whole page',
     C.snapSheetHeight(W, hP + 3, false), hP * 2 + gap);
  ok('sheet · snapping never crops what is there', C.snapSheetHeight(W, hP + 3, false) >= hP + 3);
}
{
  const v = { x: 0, y: 0, w: 100, h: 50 };
  const inn = C.zoomAbout(v, 0.5, 0.5, 0.5, 1, 1000);
  eq('camera · zooming in halves what is visible', [inn.w, inn.h], [50, 25]);
  eq('camera · about the middle, which stays where it was',
     [inn.x + inn.w / 2, inn.y + inn.h / 2], [v.x + v.w / 2, v.y + v.h / 2]);
  const corner = C.zoomAbout(v, 0.5, 0, 0, 1, 1000);
  eq('camera · about the top left, which stays where it was', [corner.x, corner.y], [0, 0]);
  eq('camera · the floor stops it', C.zoomAbout(v, 0.001, 0.5, 0.5, 20, 1000).w, 20);
  eq('camera · and the ceiling stops it', C.zoomAbout(v, 1000, 0.5, 0.5, 1, 400).w, 400);
  eq('camera · a clamped zoom keeps the aspect ratio',
     C.zoomAbout(v, 1000, 0.5, 0.5, 1, 400).h, 200);

  eq('bounds · an empty page has none', C.strokeBounds([]), null);
  const b = C.strokeBounds([{ size: 4, points: [[-100, -50, .5], [20, 30, .5]] }]);
  eq('bounds · and a drawn one is measured with the nib width',
     [b.minX, b.minY, b.maxX, b.maxY], [-102, -52, 22, 32]);
}

// ── the surface, end to end ────────────────────────────────────────────────
function makeSurface(strokes, opts) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const pad = stage.createDiv('nx-sketch-pad');
  pad.style.width = '800px';
  const s = new window.NexusSketchSurface(pad, Object.assign({ W: 800, H: 400, strokes: strokes || [] }, opts || {}));
  s._invCTM = () => null;
  s._pt = (e) => ({ x: e.__x, y: e.__y });
  s._uPerPx = () => 1;
  return s;
}
function ptr(surface, type, x, y) {
  const e = new PointerEvent(type, { bubbles: true, pointerId: 1, pointerType: 'mouse', button: 0 });
  e.__x = x; e.__y = y;
  if (type === 'pointerdown') surface._onDown(e);
  else if (type === 'pointermove') surface._onMove(e);
  else surface._onUp(e);
}
function drag(s, path) {
  ptr(s, 'pointerdown', path[0][0], path[0][1]);
  for (let i = 1; i < path.length; i++) ptr(s, 'pointermove', path[i][0], path[i][1]);
  ptr(s, 'pointerup', path[path.length - 1][0], path[path.length - 1][1]);
}
function stroke(pts) {
  return { color: '#111111', size: 3, thinning: 0, taper: 0, opacity: 1, pen: 'fountain', cap: 'round', points: pts };
}

// ── where a placed object lands: the middle of what is on SCREEN ──────────
{
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const scroller = stage.createDiv();
  scroller.style.cssText = 'height:300px;overflow-y:auto;width:400px';
  const pad = scroller.createDiv('nx-sketch-pad');
  pad.style.width = '400px';
  const s = new window.NexusSketchSurface(pad, { W: 800, H: 4000, strokes: [] });
  s.svg.style.cssText = 'display:block;width:400px;height:2000px';
  scroller.scrollTop = 1000;
  const at = s.viewCenter();
  // 400 px wide for 800 units: 2 units per px. On screen: px 1000..1300 → units 2000..2600.
  ok('placing · a long sheet scrolled down puts it where you look', Math.abs(at.y - 2300) < 30, JSON.stringify(at));
  ok('placing · centred across the sheet', Math.abs(at.x - 400) < 5, JSON.stringify(at));
  stage.innerHTML = '';
}

// ── the area eraser ────────────────────────────────────────────────────────
{
  const E = window.sketchErase;
  const line = stroke([[0, 100, .5], [400, 100, .5]]);
  const cut = E.eraseDisc([line], 200, 100, 10);
  eq('area · a disc across a line leaves two pieces', cut.length, 2);
  ok('area · the left piece ends before the disc', Math.max(...cut[0].points.map(p => p[0])) < 190);
  ok('area · the right piece starts after it', Math.min(...cut[1].points.map(p => p[0])) > 210);
  eq('area · and the original is not changed', line.points.length, 2);
  eq('area · a miss returns null', E.eraseDisc([line], 200, 300, 10), null);
  const other = stroke([[0, 300, .5], [400, 300, .5]]);
  ok('area · strokes it missed are the same objects', E.eraseDisc([line, other], 200, 100, 10).indexOf(other) >= 0);
  const box = Object.assign(stroke([[0, 0, .5], [100, 0, .5]]), { shape: { type: 'rect' } });
  ok('area · a cut shape is no longer a shape', !('shape' in E.eraseDisc([box], 50, 0, 5)[0]));
  eq('area · rubbing out a dot removes it', E.eraseDisc([stroke([[10, 10, .5]])], 10, 10, 5).length, 0);
  const graze = Object.assign(stroke([[0, 0, .5], [100, 0, .5]]), { size: 0, shape: { kind: 'line' } });
  eq('area · the rim grazing a segment is not a cut', E.eraseDisc([graze], 51.6, 10, 10), null);
  const long = stroke([[0, 0, .5], [400, 0, .5], [400, 400, .5]]);
  const parts = E.eraseDisc([long], 100, 0, 5);
  ok('area · far segments keep their points', parts[1].points.slice(-2).every(p => long.points.indexOf(p) >= 0) && parts[1].points.length < 120, parts[1].points.length);
  eq('area · the cut ends are marked', [!!parts[0].cutStart, !!parts[0].cutEnd, !!parts[1].cutStart, !!parts[1].cutEnd], [false, true, true, false]);
  eq('area · a quick swipe erases a band, not two holes',
     E.eraseSweep([line], { x: 100, y: 100 }, { x: 300, y: 100 }, 10).length, 2);

  const s = makeSurface([stroke([[100, 100, .5], [700, 100, .5]])]);
  s.setMode('erase');
  s.setEraser('area', 'm');
  drag(s, [[400, 80], [400, 100], [400, 120]]);
  eq('area · on the surface the stroke is cut in two', s.strokes.length, 2);
  s.undo();
  eq('area · undo is one step and gives the whole stroke back', [s.strokes.length, s.strokes[0].points.length], [1, 2]);
  s.redo();
  eq('area · redo cuts it again', s.strokes.length, 2);
  ptr(s, 'pointerdown', 250, 100);
  const during = s.strokes.length;
  s.undo();
  eq('area · an undo mid-rub is ignored', s.strokes.length, during);
  ptr(s, 'pointerup', 250, 100);
  s.undo();
  eq('area · and the rub is still one undo step', s.strokes.length, 2);
  ok('area · the ring is gone after lifting', !s.svg.querySelector('.nx-sk-erasering'));
  s.setEraser('stroke');
  drag(s, [[150, 100], [150, 100]]);
  eq('area · the stroke eraser still takes a whole piece', s.strokes.length, 1);
}

{
  const s = makeSurface([
    stroke([[100, 50, .5], [200, 60, .5]]),     // above the line
    stroke([[100, 200, .5], [200, 210, .5]]),   // below it
  ]);
  s.setMode('space');
  ok('spacing · the pad says which tool is armed', s.host.classList.contains('is-space'));
  const h0 = s.H;
  drag(s, [[400, 120], [400, 160], [400, 220]]);
  eq('spacing · the stroke below moved down by the drag', s.strokes[1].points[0][1], 300);
  eq('spacing · the one above stayed', s.strokes[0].points[0][1], 50);
  ok('spacing · the paper grew with the gap', s.H > h0, 'H ' + s.H + ' was ' + h0);
  s.undo();
  eq('spacing · undo puts the ink back', s.strokes[1].points[0][1], 200);
  eq('spacing · and the paper back', s.H, h0);
  s.redo();
  eq('spacing · redo opens the gap again', s.strokes[1].points[0][1], 300);
}

{
  // Pulling up can close a gap, but not drag content through the line.
  const s = makeSurface([stroke([[100, 200, .5], [200, 210, .5]])]);
  s.setMode('space');
  drag(s, [[400, 150], [400, 100], [400, 20]]);
  eq('spacing · closing stops where the content meets the line', s.strokes[0].points[0][1], 150);
}

{
  // A tap with no movement must not write an undo entry.
  const s = makeSurface([stroke([[100, 200, .5], [200, 210, .5]])]);
  s.setMode('space');
  const before = s.undoStack.length;
  drag(s, [[400, 150], [400, 150]]);
  eq('spacing · a tap changes nothing', s.undoStack.length, before);
}

{
  // Two fingers moving apart is a pinch, and a pinch is a zoom — the reported
  // bug was a gate in front of this that a whole surface kind never got past.
  const s = makeSurface([], { pageZoom: true });
  s._touches = new Map([[1, { x: 100, y: 100 }], [2, { x: 200, y: 100 }]]);
  s._gestMode = 'pending';
  s._pending = { d: 100, cx: 150, cy: 100 };
  s._touches.set(2, { x: 260, y: 100 });   // pinch open by 60px
  s._applyGesture();
  eq('zoom · fingers moving apart enter the pinch', s._gestMode, 'zoom');

  // …and two fingers travelling together is the page scrolling, not a zoom.
  const pan = makeSurface([], { pageZoom: true });
  pan._touches = new Map([[1, { x: 100, y: 100 }], [2, { x: 200, y: 100 }]]);
  pan._gestMode = 'pending';
  pan._pending = { d: 100, cx: 150, cy: 100 };
  pan._touches.set(1, { x: 100, y: 160 });
  pan._touches.set(2, { x: 200, y: 160 });
  pan._applyGesture();
  eq('zoom · two fingers moving together scroll instead', pan._gestMode, 'scroll');
}

{
  // Zooming out past 1 is what gives an endless page an overview.
  const s = makeSurface([], { pageZoom: true });
  s.setPageZoom(0.5);
  near('zoom · out below 1 is allowed now', s.getPageZoom(), 0.5, 0.001);
  s.setPageZoom(0.01);
  near('zoom · but not to nothing', s.getPageZoom(), 0.3, 0.001);
  s.setPageZoom(99);
  near('zoom · and not past the ceiling', s.getPageZoom(), 5, 0.001);
  let fired = 0;
  s.onZoom = () => fired++;
  s.setPageZoom(1);
  eq('zoom · returning to 1 reports the change', fired, 1);
  s.setPageZoom(1);
  eq('zoom · setting the same level again reports nothing', fired, 1);
}

{
  // The width cap is what keeps portrait and landscape the same size.
  const s = makeSurface([], { paperWidth: 900 });
  eq('width · the cap is on the pad', s.host.style.maxWidth, '900px');
  ok('width · and it is centred', s.host.style.marginInline === 'auto');
  s.setPaperWidth(0);
  eq('width · zero clears it', s.host.style.maxWidth, '');
}

// ── sectioned paper: real pages, on the pad and in the file ────────────────
{
  const s = makeSurface([], { paperType: 'sectioned', bg: '#ffffff' });
  const pageH = C.sheetHeight(s.W, false), gap = C.sheetGap(s.W);
  ok('sectioned · the pad says what it is', s.host.classList.contains('nx-sk-sectioned'));
  eq('sectioned · a fresh pad is a whole page tall', s.H, pageH);
  eq('sectioned · and paints exactly one sheet', s.gPaper.children.length, 1);
  ok('sectioned · with an edge you can see', !!s.gPaper.children[0].getAttribute('stroke'));

  s.setHeight(pageH + 5);
  eq('sectioned · growing past a page edge adds a whole page', s.H, pageH * 2 + gap);
  eq('sectioned · which is painted as a second sheet', s.gPaper.children.length, 2);
  eq('sectioned · with the gap left empty between them',
     Number(s.gPaper.children[1].getAttribute('y')), pageH + gap);

  const svg = s.toSVGString();
  const data = window.parseSketchSVG(svg);
  eq('sectioned · the paper type is in the file', data.paperType, 'sectioned');
  eq('sectioned · and the file carries one rect per page',
     (svg.match(/<rect /g) || []).length >= 2, true);

  s.setPaperType('sectioned', true);
  eq('sectioned · turned landscape, two sheets are still two sheets',
     C.sheetCount(s.W, s.H, true), 2);
  eq('sectioned · of the page size it is now', s.H, C.sheetHeight(s.W, true) * 2 + C.sheetGap(s.W));
  eq('sectioned · and that travels too', window.parseSketchSVG(s.toSVGString()).sheetLandscape, true);
}

// ── mindmap paper: a camera, not a sheet ───────────────────────────────────
{
  const s = makeSurface([], { paperType: 'mindmap', pageZoom: true });
  ok('mindmap · the pad says what it is', s.host.classList.contains('nx-sk-infinite'));
  ok('mindmap · page zoom is parked — the camera does that job', !s.pageZoom);
  eq('mindmap · there is no bottom edge to drag', (s.setHeight(99999), s.H), 400);

  // The whole point: panning is not clamped to anything.
  s.viewX = -5000; s.viewY = -9000;
  s._applyView();
  eq('mindmap · panning off the drawing is allowed', [s.viewX, s.viewY], [-5000, -9000]);
  ok('mindmap · and the viewBox goes with it', s.svg.getAttribute('viewBox').indexOf('-5000') === 0,
     s.svg.getAttribute('viewBox'));
  ok('mindmap · the paper follows the camera',
     Number(s.gPaper.children.length) === 0 || Number(s.gPaper.children[0].getAttribute('x')) < 0);

  // 100 % means one logical canvas width across the pane, the same thing page
  // width means on a sheet.
  s.setPageZoom(1);
  near('mindmap · back to 100 % is one canvas width', s.viewW, s.W, 0.5);
  near('mindmap · which is what the pill reads', s.getPageZoom(), 1, 0.001);
  s.setPageZoom(2);
  near('mindmap · twice as big shows half as much', s.viewW, s.W / 2, 0.5);
  s.setPageZoom(9999);
  ok('mindmap · and it cannot be zoomed past its stop', s.getPageZoom() <= 8.001, s.getPageZoom());
}
{
  // An infinite plane has no edges, so the file is cropped to what was drawn.
  const s = makeSurface([], { paperType: 'mindmap' });
  s.strokes = [stroke([[-400, -300, .5], [-380, -280, .5]])];
  const f = s._exportFrame();
  ok('mindmap · the export is cropped to the ink, not to the canvas', f.x < -400 && f.y < -300,
     JSON.stringify(f));
  const svg = s.toSVGString();
  ok('mindmap · so the file starts where the drawing does',
     svg.indexOf('viewBox="' + f.x + ' ' + f.y) > 0, svg.slice(0, 120));
  eq('mindmap · and a rasteriser is told that size, not the canvas size',
     [s.exportSize().w, s.exportSize().h], [f.w, f.h]);
  const data = window.parseSketchSVG(svg);
  eq('mindmap · the paper type survives the round trip', data.paperType, 'mindmap');
  ok('mindmap · and so does the camera, which is where it reopens',
     data.view && data.view.w > 0, JSON.stringify(data.view));
}
{
  // Switching back and forth must leave a usable sheet behind, not a plane's
  // leftovers.
  const s = makeSurface([], { paperType: 'endless', pageZoom: true });
  s.setPageZoom(2.5);
  s.setPaperType('mindmap');
  // The sheet's zoom can only be undone while it is still a sheet — afterwards
  // setPageZoom means something else entirely.
  near('mindmap · the sheet zoom it came from is undone on the way in', s.pageScale, 1, 0.001);
  eq('mindmap · and the pad is not left at that width', s.host.style.width, '');
  s.viewX = 900; s.viewY = 900; s._applyView();
  s.setPaperType('endless');
  ok('mindmap · coming back gives page zoom back', s.pageZoom);
  near('mindmap · at 1x, not at the zoom it left with', s.getPageZoom(), 1, 0.001);
  eq('mindmap · and puts the sheet back at its own width', [s.viewX, s.viewY, s.viewW], [0, 0, s.W]);
  ok('mindmap · the pad stops calling itself a plane', !s.host.classList.contains('nx-sk-infinite'));
}
{
  // The chip in the popover fires on every tap. A second tap on the paper it
  // already is must not move home to wherever you have panned to since.
  const s = makeSurface([], { paperType: 'mindmap' });
  s.viewX = 5000; s.viewY = 5000; s._applyView();
  s.setPaperType('mindmap');
  eq('mindmap · re-picking the paper it already is does nothing to home',
     [s._home.x, s._home.y], [0, 0]);
}
{
  /* A sheet clamps its view to 0,0 and exports 0 0 W H, so ink a plane let you
     draw above or left of the origin would be unreachable AND missing from the
     file. It has to be moved, not lost — in one undo step. */
  const s = makeSurface([], { paperType: 'mindmap' });
  s.strokes = [stroke([[-500, -400, .5], [-450, -350, .5]])];
  s.sections = [{ y: -600, title: 'Top' }];
  s.setPaperType('endless');
  const b = s._contentBounds();
  ok('mindmap · nothing is left in negative space when it becomes a sheet',
     b.minX >= 0 && b.minY >= 0, JSON.stringify(b));
  ok('mindmap · and the sheet is long enough to hold it', s.H >= b.maxY, 'H ' + s.H + ' maxY ' + b.maxY);
  s.undo();
  eq('mindmap · one undo puts the whole drawing back where it was',
     [s.strokes[0].points[0][0], s.strokes[0].points[0][1], s.sections[0].y], [-500, -400, -600]);
}
{
  // A section is drawn by the exporter too, so the crop has to know about it.
  const s = makeSurface([], { paperType: 'mindmap' });
  s.strokes = [stroke([[100, 100, .5], [120, 120, .5]])];
  s.sections = [{ y: -3000, title: 'Way up' }];
  ok('mindmap · the export frame takes sections in', s._exportFrame().y < -3000,
     JSON.stringify(s._exportFrame()));
}
{
  // setHeight is a no-op on a plane, so an unguarded auto-grow test would be
  // true for every sample and pay for a forced layout each time.
  const mk = (opts) => {
    const s = makeSurface([], Object.assign({ autoGrow: true }, opts));
    s._grew = 0;

/* ── Finger taps ───────────────────────────────────────────────────────────
   The engine sees taps as pointer events, so they are driven as pointer events
   here: down/up with no travel in between. `wait` is real time; the page is
   rendered with a virtual-time budget, so the multi-tap window actually
   elapses instead of being skipped. */
function tap(s, fingers, x, y) {
  const ids = [];
  for (let i = 0; i < fingers; i++) {
    const id = 100 + i;
    ids.push(id);
    const e = new PointerEvent('pointerdown', { bubbles: true, pointerId: id, pointerType: 'touch' });
    Object.defineProperty(e, 'clientX', { value: (x || 100) + i * 30 });
    Object.defineProperty(e, 'clientY', { value: y || 100 });
    s._onDown(e);
  }
  for (const id of ids) {
    const e = new PointerEvent('pointerup', { bubbles: true, pointerId: id, pointerType: 'touch' });
    s._onUp(e);
  }
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const MULTI_WAIT = 600;   // comfortably past the engine's multi-tap window

/* A surface with real undo history: the initial `strokes` option is the state
   BEFORE the first edit, so there is nothing to undo about it. */
function drawn(count, opts) {
  const s = makeSurface([], opts);
  for (let i = 0; i < count; i++) drag(s, [[100, 40 + i * 60], [160, 60 + i * 60], [220, 40 + i * 60]]);
  return s;
}

  /* ── Sideways: the page turn ──────────────────────────────────────────── */
  async function throwFinger(s, dx, dy, ms) {
    const down = new PointerEvent('pointerdown', { bubbles: true, pointerId: 21, pointerType: 'touch' });
    Object.defineProperty(down, 'clientX', { value: 200 });
    Object.defineProperty(down, 'clientY', { value: 300 });
    s._onDown(down);
    const steps = 4;
    for (let i = 1; i <= steps; i++) {
      const move = new PointerEvent('pointermove', { bubbles: true, pointerId: 21, pointerType: 'touch' });
      Object.defineProperty(move, 'clientX', { value: 200 + dx * i / steps });
      Object.defineProperty(move, 'clientY', { value: 300 + dy * i / steps });
      s._onMove(move);
    }
    if (ms) await wait(ms);   // a busy-wait would stop virtual time, not the drag
    s._onUp(new PointerEvent('pointerup', { bubbles: true, pointerId: 21, pointerType: 'touch' }));
  }
  {
    const s = makeSurface([], { pageZoom: true });
    const seen = [];
    s.onSwipe = (dir) => seen.push(dir);
    await throwFinger(s, -160, 10);
    eq('swipe · thrown left is the next page', seen, ['next']);
    await throwFinger(s, 160, -10);
    eq('swipe · thrown right is the previous one', seen, ['next', 'prev']);
  }
  {
    // Everything the gesture must NOT be.
    const s = makeSurface([], { pageZoom: true });
    const seen = [];
    s.onSwipe = (dir) => seen.push(dir);
    await throwFinger(s, -40, 0);
    eq('swipe · a short drag is not a swipe', seen, []);
    await throwFinger(s, -160, 200);
    eq('swipe · a diagonal one is scrolling', seen, []);
    await throwFinger(s, 0, -300);
    eq('swipe · and scrolling the page is never a page turn', seen, []);
    await throwFinger(s, -160, 0, 700);
    eq('swipe · a slow drag is not a throw', seen, []);
  }

    // Zoomed in, sideways is how you look around the sheet.

    s.svg.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: 300, ctrlKey: true }));
    near('wheel · and back out again', s.getPageZoom(), 1, 0.02);
  }
  {
    // A new note’s sidecar is written before anything is drawn on it, so the
    // Sketch tab opens on a real file instead of on "not found".
    const back = window.parseSketchSVG(window.emptySketchSVG());
    ok('empty sidecar · parses back', !!back, 'got ' + back);
    eq('empty sidecar · with no strokes in it', back.strokes.length, 0);
    ok('empty sidecar · and a usable page size', back.w > 0 && back.h > 0, back.w + 'x' + back.h);
  }
}


const finish = () => {
  if (window.__err && window.__err.length) out.push('LOAD ERROR: ' + window.__err.join('\n'));
  out.push('');
  out.push(fail === 0 ? ('ALL GREEN — ' + pass + ' checks') : (fail + ' FAILED of ' + (pass + fail)));
  document.getElementById('out').textContent = out.join('\n');
};
tapTests().catch(e => { out.push('THREW: ' + (e && e.stack || e)); fail++; }).then(finish);
</script>
