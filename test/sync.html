<!doctype html>
<html><head><meta charset="utf-8"><title>sync harness</title>
<style>
:root { --background-primary:#1e1e1e; --interactive-accent:#fb6734; }
body { margin:0; background:#141414; color:#ddd; font:13px/1.5 system-ui; padding:20px; }
</style></head><body>
<pre id="out"></pre>
<script>window.__err=[];window.onerror=(m,f,l,c,e)=>{window.__err.push(String(m)+"\n"+(e&&e.stack||""));};</script>
<script src="bundle.js"></script>
<script>
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
function eq(n, g, w) { const a = JSON.stringify(g), b = JSON.stringify(w); ok(n, a === b, 'got ' + a + ' want ' + b); }

(async () => {
try {
const S = window.vaultSyncLib;
const W = window.webdavLib;

const f = (mtime, size) => ({ mtime, size });
/* The base remembers what EACH side looked like — see baseSide(). */
const b = (localEntry, remoteEntry) => ({ local: localEntry || null, remote: remoteEntry === undefined ? localEntry : remoteEntry });

// ── the three-way decision, one file at a time ─────────────────────────────
{
  const same = f(1000, 10);
  const base = b(same);
  eq('decide · nothing anywhere', S.decide('a', null, null, null).action, 'none');
  eq('decide · untouched on both sides', S.decide('a', same, same, base).action, 'none');

  eq('decide · new here', S.decide('a', f(2000, 5), null, null).action, 'upload');
  eq('decide · new there', S.decide('a', null, f(2000, 5), null).action, 'download');

  eq('decide · edited here', S.decide('a', f(3000, 20), same, base).action, 'upload');
  eq('decide · edited there', S.decide('a', same, f(3000, 20), base).action, 'download');

  // The case a two-way sync cannot answer.
  eq('decide · deleted here', S.decide('a', null, same, base).action, 'deleteRemote');
  eq('decide · deleted there', S.decide('a', same, null, base).action, 'deleteLocal');
  eq('decide · deleted on both sides', S.decide('a', null, null, base).action, 'none');

  eq('decide · edited on both sides is a conflict',
     S.decide('a', f(3000, 20), f(4000, 30), base).action, 'conflict');
  eq('decide · deleted here and edited there is a conflict',
     S.decide('a', null, f(4000, 30), base).action, 'conflict');
  eq('decide · edited here and deleted there is a conflict',
     S.decide('a', f(3000, 20), null, base).action, 'conflict');
  // Both sides ended up with the same thing — nothing to argue about.
  /* With a record, two sides that both moved are never taken as equal unseen:
     the bytes decide (the runner adopts them when they match). */
  eq('decide · both edited to the same size and time is compared, not assumed equal',
     S.decide('a', f(3000, 20), f(3000, 20), base).action, 'compare');

  // Clock skew between machines is not an edit.
  eq('decide · a second of clock skew is not a change',
     S.decide('a', f(1900, 10), same, base).action, 'none');
  ok('decide · three seconds is', S.decide('a', f(4000, 10), same, base).action === 'upload');
  ok('decide · and a different size always is',
     S.decide('a', f(1000, 11), same, base).action === 'upload');

  /* The regression that made this a two-sided record: a server stamps its own
     time on an upload, so the sides legitimately differ afterwards. With one
     timestamp for both, the next run called the remote side changed and
     downloaded back what had just been uploaded — for ever. */
  const mine = f(1000, 10), theirs = f(61000, 10);
  eq('decide · after an upload the two sides may differ and nothing is due',
     S.decide('a', mine, theirs, b(mine, theirs)).action, 'none');
  eq('decide · and a real later edit is still caught',
     S.decide('a', f(99000, 12), theirs, b(mine, theirs)).action, 'upload');

  // A state file from before the record had two sides is still readable.
  eq('decide · an old one-sided base is read, not treated as new',
     S.decide('a', same, same, same).action, 'none');
  eq('base · both sides are recorded', S.agreement(mine, theirs), { local: mine, remote: theirs });
  eq('base · a missing side is null', S.agreement(mine, null).remote, null);
}

// ── refusing to run ────────────────────────────────────────────────────────
{
  /* The failure this guards against: a wrong URL, or a folder renamed on the
     server, answers with an empty listing — and every file then looks deleted
     remotely. Without the guard the plan is to delete the whole vault. */
  const local = {}, base = {};
  for (let i = 0; i < 40; i++) { local['n' + i + '.md'] = f(1000, 10); base['n' + i + '.md'] = b(f(1000, 10)); }
  const wiped = S.planSync(local, {}, base);
  eq('guard · without it, everything would go', wiped.deleteLocal.length, 40);
  const verdict = S.safetyCheck(wiped, local, {}, base);
  ok('guard · an empty server folder stops the run', !verdict.safe);
  ok('guard · and says why in words', /empty/.test(verdict.reason), verdict.reason);

  // A first sync has nothing recorded, so an empty server is simply a new one.
  ok('guard · a first sync against an empty server is fine',
     S.safetyCheck(S.planSync(local, {}, {}), local, {}, {}).safe);

  // Deleting a few files is normal work.
  const fewGone = {};
  Object.keys(local).forEach((k, i) => { if (i > 4) fewGone[k] = f(1000, 10); });
  ok('guard · deleting five of forty is left alone',
     S.safetyCheck(S.planSync(local, fewGone, base), local, fewGone, base).safe);

  // Deleting most of them is not.
  const mostGone = { 'n0.md': f(1000, 10), 'n1.md': f(1000, 10) };
  const big = S.safetyCheck(S.planSync(local, mostGone, base), local, mostGone, base);
  ok('guard · deleting most of them stops the run', !big.safe);
  ok('guard · and counts them out loud', /38 of 40/.test(big.reason), big.reason);

  // The same protection in the other direction.
  const gone = {};
  const remoteAll = {};
  Object.keys(local).forEach(k => { remoteAll[k] = f(1000, 10); });
  const wipeRemote = S.safetyCheck(S.planSync(gone, remoteAll, base), gone, remoteAll, base);
  ok('guard · and it protects the server side too', !wipeRemote.safe, JSON.stringify(wipeRemote));
}

// ── the whole plan ─────────────────────────────────────────────────────────
{
  const local  = { 'a.md': f(2000, 5), 'both.md': f(1000, 9), 'mine.md': f(3000, 4) };
  const remote = { 'b.md': f(2000, 5), 'both.md': f(1000, 9), 'theirs.md': f(3000, 4) };
  const base   = { 'both.md': b(f(1000, 9)), 'gone.md': b(f(500, 2)) };
  const plan = S.planSync(local, remote, base);
  eq('plan · new here goes up', plan.upload.map(x => x.path), ['a.md', 'mine.md']);
  eq('plan · new there comes down', plan.download.map(x => x.path), ['b.md', 'theirs.md']);
  eq('plan · nothing untouched is moved', plan.conflict.length, 0);
  // 'gone.md' was in the agreement and is on neither side now.
  eq('plan · a file gone from both sides needs nothing', S.planSize(plan), 4);

  const skipped = S.planSync(local, remote, base, { skip: p => p === 'a.md' });
  ok('plan · a skipped path is reported and not acted on',
     skipped.skipped.indexOf('a.md') >= 0 && skipped.upload.every(x => x.path !== 'a.md'));
}

// ── conflicts ──────────────────────────────────────────────────────────────
{
  const verdict = { path: 'notes/Idea.md', action: 'conflict' };
  const mine = f(5000, 10), theirs = f(9000, 12);
  eq('conflict · keep both by default', S.resolveConflict(verdict, 'keepBoth', mine, theirs).act, 'keepBoth');
  eq('conflict · newer picks the server here', S.resolveConflict(verdict, 'newer', mine, theirs).act, 'download');
  eq('conflict · and this device the other way', S.resolveConflict(verdict, 'newer', theirs, mine).act, 'upload');
  eq('conflict · a tie is not decided by a coin toss',
     S.resolveConflict(verdict, 'newer', mine, mine).act, 'keepBoth');
  eq('conflict · this device wins', S.resolveConflict(verdict, 'local', mine, theirs).act, 'upload');
  eq('conflict · the server wins', S.resolveConflict(verdict, 'remote', mine, theirs).act, 'download');
  // A side that no longer has the file resolves to a deletion, not an upload of nothing.
  eq('conflict · preferring a side that deleted it deletes it',
     S.resolveConflict(verdict, 'local', null, theirs).act, 'deleteRemote');

  eq('conflict · the copy says where it came from',
     S.conflictCopyName('notes/Idea.md', 'Tablet', '2026-08-31 1400'),
     'notes/Idea (conflict Tablet 2026-08-31 1400).md');
  eq('conflict · a file without an extension still works',
     S.conflictCopyName('LICENSE', 'Desk', '2026-08-31 1400'), 'LICENSE (conflict Desk 2026-08-31 1400)');
  eq('conflict · a dot in a folder name is not an extension',
     S.conflictCopyName('a.b/Idea', 'Desk', 'x'), 'a.b/Idea (conflict Desk x)');
  ok('conflict · a device name cannot inject a path separator',
     S.conflictCopyName('a.md', 'me/../etc', 'x').indexOf('/etc') < 0,
     S.conflictCopyName('a.md', 'me/../etc', 'x'));
}

// ── what never travels ─────────────────────────────────────────────────────
{
  const withConfig = S.makeSkip({ config: true });
  const without = S.makeSkip({ config: false });

  ok('skip · a note is synced', !withConfig('Journal/2026-08-31.md'));
  ok('skip · settings travel when config is on', !withConfig('.obsidian/appearance.json'));
  ok('skip · and not when it is off', without('.obsidian/appearance.json'));

  // The point of D3: settings follow, the window layout does not.
  ok('skip · the window layout never travels', withConfig('.obsidian/workspace.json'));
  ok('skip · nor the mobile one', withConfig('.obsidian/workspace-mobile.json'));
  ok('skip · nor the graph view', withConfig('.obsidian/graph.json'));
  ok('skip · nor the sync\'s own state', withConfig('.obsidian/plugins/nexus-suite/sync-state.json'));
  ok('skip · but a plugin\'s settings do', !withConfig('.obsidian/plugins/dataview/data.json'));

  ok('skip · git is never synced', withConfig('.git/config'));
  ok('skip · nor the trash', withConfig('.trash/old.md'));
  ok('skip · nor Syncthing leftovers', withConfig('Notes/a.sync-conflict-20260831.md'));
  // Other sync tools' working files: uploading them is how two syncs fight.
  ok('skip · nor a Syncthing temp file', withConfig('Notes/.syncthing.Idea.md.tmp'));
  ok('skip · nor the other Syncthing temp form', withConfig('~syncthing~Idea.md.tmp'));
  ok('skip · nor the Nextcloud client journal', withConfig('.sync_37e38dcda31e.db'));
  ok('skip · nor its write-ahead log', withConfig('.sync_37e38dcda31e.db-wal'));
  ok('skip · nor the Nextcloud client log', withConfig('.nextcloudsync.log'));
  ok('skip · but a note that merely looks similar is synced', !withConfig('Notes/sync_37e3.db.md'));
  ok('skip · nor this device\'s own state', withConfig(S.statePath('dev-a')));
  eq('state · the file name carries the device id', S.statePath('dev-a'), '.obsidian/plugins/nexus-suite/sync-state.dev-a.json');
  ok('state · two devices never share one', S.statePath('dev-a') !== S.statePath('dev-b'));
  ok('state · an id cannot leave the plugin folder', S.statePath('../../x').indexOf('/../') < 0, S.statePath('../../x'));
  ok('skip · nor node_modules', withConfig('.obsidian/plugins/x/node_modules/y.js'));

  const custom = S.makeSkip({ config: true, exclude: ['Archive/', '*.tmp', 'exact.md'] });
  ok('skip · a folder rule', custom('Archive/2020/old.md'));
  ok('skip · a glob', custom('anything.tmp'));
  ok('skip · an exact path', custom('exact.md'));
  ok('skip · and nothing else', !custom('Archive.md'));
  ok('skip · an empty path is never synced', custom(''));
}

// ── backups ────────────────────────────────────────────────────────────────
{
  eq('backup · the folder sits beside the vault folder',
     S.backupFolderUrl('https://cloud.example/remote.php/dav/files/A%20B/Obsidian/nexus/'),
     'https://cloud.example/remote.php/dav/files/A%20B/Obsidian/nexus-backup');
  eq('backup · a vault at the very top has nowhere beside it', S.backupFolderUrl('https://cloud.example'), '');
  eq('backup · a vault at the top of the WebDAV space has none either',
     [S.backupFolderUrl('https://c.example/remote.php/dav/files/A%20B'), S.backupFolderUrl('https://c.example/remote.php/webdav/')], ['', '']);
  eq('backup · a snapshot is named by its day', S.backupName('2026-08-31T12:00'), '2026-08-31');
  eq('backup · one made by hand carries the time', S.backupName('2026-08-31', '1405'), '2026-08-31 1405');
  eq('backup · only names this code writes carry a date',
     [S.backupDate('2026-08-31'), S.backupDate('2026-08-31 1405'), S.backupDate('nexus 2026-08-30.zip'),
      S.backupDate('notes 2026-08-30.md'), S.backupDate('2026-08-31.partial-dev-a'), S.backupDate('notes.txt')],
     ['2026-08-31', '2026-08-31', '2026-08-30', '', '', '']);

  ok('backup · the first one is always needed', S.needsBackup('', '2026-08-31'));
  ok('backup · a second one the same day is not', !S.needsBackup('2026-08-31', '2026-08-31'));
  ok('backup · the next day it is', S.needsBackup('2026-08-31', '2026-09-01'));

  const names = ['2026-08-31', 'v 2026-08-28.zip', '2026-08-30', 'v 2026-08-29.zip', 'readme.txt'];
  eq('rotate · under the limit, nothing goes', S.backupsToDelete(names, 4), []);
  eq('rotate · over it, the oldest go first, zips and folders alike', S.backupsToDelete(names, 2),
     ['v 2026-08-28.zip', 'v 2026-08-29.zip']);
  eq('rotate · keeping one keeps the newest', S.backupsToDelete(names, 1), ['v 2026-08-28.zip', 'v 2026-08-29.zip', '2026-08-30']);
  ok('rotate · a file without a date is never touched', S.backupsToDelete(names, 1).indexOf('readme.txt') < 0);
}

// ── URLs and PROPFIND ──────────────────────────────────────────────────────
{
  eq('url · joined', W.joinUrl('https://h/dav/Vault', 'Notes/a.md'), 'https://h/dav/Vault/Notes/a.md');
  eq('url · a trailing slash on the base is not doubled',
     W.joinUrl('https://h/dav/Vault/', 'a.md'), 'https://h/dav/Vault/a.md');
  eq('url · the root itself', W.joinUrl('https://h/dav/Vault', ''), 'https://h/dav/Vault/');
  eq('url · a space is encoded', W.joinUrl('https://h/d', 'My Notes/a b.md'), 'https://h/d/My%20Notes/a%20b.md');
  eq('url · and each segment separately, so a slash cannot escape',
     W.joinUrl('https://h/d', 'a/b.md'), 'https://h/d/a/b.md');

  eq('href · an absolute path back to a vault path',
     W.hrefToPath('/dav/Vault/Notes/a.md', 'https://h/dav/Vault'), 'Notes/a.md');
  eq('href · a full URL too',
     W.hrefToPath('https://h/dav/Vault/Notes/a.md', 'https://h/dav/Vault'), 'Notes/a.md');
  eq('href · percent-encoding is undone',
     W.hrefToPath('/dav/Vault/My%20Notes/a.md', 'https://h/dav/Vault'), 'My Notes/a.md');
  eq('href · a trailing slash on a folder goes',
     W.hrefToPath('/dav/Vault/Notes/', 'https://h/dav/Vault'), 'Notes');

  const XML = '<?xml version="1.0"?><d:multistatus xmlns:d="DAV:">'
    + '<d:response><d:href>/dav/V/</d:href><d:propstat><d:prop>'
    + '<d:resourcetype><d:collection/></d:resourcetype></d:prop></d:propstat></d:response>'
    + '<d:response><d:href>/dav/V/a.md</d:href><d:propstat><d:prop>'
    + '<d:resourcetype/><d:getlastmodified>Mon, 31 Aug 2026 10:00:00 GMT</d:getlastmodified>'
    + '<d:getcontentlength>42</d:getcontentlength><d:getetag>"abc"</d:getetag>'
    + '</d:prop></d:propstat></d:response></d:multistatus>';
  const list = W.parseListing(XML, 'https://h/dav/V');
  eq('propfind · both entries', list.length, 2);
  ok('propfind · the collection is marked', list[0].folder === true);
  eq('propfind · the file path', list[1].path, 'a.md');
  eq('propfind · its size', list[1].size, 42);
  ok('propfind · its date is parsed', list[1].mtime > 0);
  eq('propfind · the etag loses its quotes', list[1].etag, 'abc');
  eq('propfind · rubbish gives nothing rather than throwing', W.parseListing('not xml at all', 'x'), []);
}

// ── the runner: one MKCOL chain per folder, not per file ───────────────────
{
  const R = window.vaultSyncRunLib;
  const adapter = {
    async exists() { return true; },
    async mkdir() {},
    async readBinary() { return new ArrayBuffer(2); },
    async writeBinary() {},
  };
  const plugin = {
    app: { vault: { adapter, getAbstractFileByPath: () => null }, workspace: { onLayoutReady() {} } },
    settings: { vaultSync: { enabled: true } },
    getCredential: () => ({}), deviceId: () => 'test-device',
    deviceSetting: (key, fallback) => fallback,
  };
  const vs = new R.NexusVaultSync(plugin);
  const made = [];
  const client = { async ensureFolder(p) { made.push(p); }, async put() {} };

  await (async () => {
    await vs.upload(client, 'Tasks/Items/one.md');
    await vs.upload(client, 'Tasks/Items/two.md');
    await vs.upload(client, 'Tasks/Items/three.md');
    eq('runner · a folder is created once, not once per file in it', made, ['Tasks/Items']);
    await vs.upload(client, 'Tasks/Projects/a.md');
    eq('runner · a different folder is still created', made, ['Tasks/Items', 'Tasks/Projects']);
    await vs.upload(client, 'Tasks/loose.md');
    ok('runner · and a parent already walked through is not created again',
       made.length === 2, made.join('|'));
  })();
}

// ── the runner against a MOBILE file system ────────────────────────────────
/* The decisions above are pure and were always right; what broke was carrying
   them out on a phone. `adapter.mkdir` is not the same call on both platforms:
   asked for "Tasks/Items" where "Tasks" does not exist, the desktop makes both
   and the mobile adapter refuses. The device that downloads a vault it does not
   have yet — the second device, which is the entire point — then failed on
   every file deeper than one folder, and failed again on every run because a
   file that never arrived never enters the state.

   This adapter is the mobile one: mkdir with a missing parent throws. */
{
  const R = window.vaultSyncRunLib;

  function mobileAdapter() {
    const files = {}, folders = { '': true };
    return {
      _files: files, _folders: folders,
      async exists(p) { return !!files[p] || !!folders[p]; },
      async mkdir(p) {
        const parent = p.indexOf('/') >= 0 ? p.slice(0, p.lastIndexOf('/')) : '';
        if (!folders[parent]) throw new Error('ENOENT: no such directory, mkdir "' + p + '"');
        folders[p] = true;
      },
      async writeBinary(p, data) {
        const parent = p.indexOf('/') >= 0 ? p.slice(0, p.lastIndexOf('/')) : '';
        if (!folders[parent]) throw new Error('ENOENT: no such directory, write "' + p + '"');
        files[p] = data;
      },
      async readBinary(p) { return files[p]; },
      async remove(p) { delete files[p]; },
      async stat(p) { return files[p] ? { mtime: 1000, size: 1 } : null; },
      async list() { return { files: [], folders: [] }; },
    };
  }
  function runner(adapter) {
    // The connection is per device now, so the stub answers from a device bag.
    const bag = { vaultSyncUrl: 'https://example.invalid/dav' };
    const plugin = {
      app: { vault: { adapter, getAbstractFileByPath: () => null }, workspace: { onLayoutReady() {} } },
      settings: { vaultSync: { enabled: true, conflict: 'keepBoth' } },
      getCredential: () => ({ username: 'u', secret: 'p' }),
      deviceId: () => 'test-device',
      deviceSetting: (key, fallback) => (bag[key] === undefined ? fallback : bag[key]),
    };
    return new R.NexusVaultSync(plugin);
  }
  const fakeServer = { async get() { return { arrayBuffer: new ArrayBuffer(4) }; } };

  /* Where the runner reads the connection from: the device bag, never the
     vault-wide settings that a sync would have replaced. */
  {
    const vs = runner(mobileAdapter());
    vs.plugin.settings.vaultSync.url = 'https://wrong.example/other-device';
    eq('runner · the server URL comes from the device store', vs.url, 'https://example.invalid/dav');
    eq('runner · a leftover vault-wide URL is ignored', vs.client().baseUrl, 'https://example.invalid/dav');
    eq('runner · the schedule falls back to the default when this device set none', vs.intervalMin, 15);
    ok('runner · and syncing on start is on unless this device said otherwise', vs.onStart === true);
  }

  await (async () => {
    const adapter = mobileAdapter();
    const vs = runner(adapter);
    let threw = '';
    try { await vs.download(fakeServer, 'Tasks/Items/one.md'); }
    catch (e) { threw = e && e.message ? e.message : String(e); }
    ok('runner · a download two folders deep succeeds where mkdir is not recursive', !threw, threw);
    ok('runner · the parent folder was created', !!adapter._folders['Tasks'], JSON.stringify(adapter._folders));
    ok('runner · and so was the one below it', !!adapter._folders['Tasks/Items'], JSON.stringify(adapter._folders));
    ok('runner · the file landed', !!adapter._files['Tasks/Items/one.md'], JSON.stringify(Object.keys(adapter._files)));
  })();

  await (async () => {
    const adapter = mobileAdapter();
    const vs = runner(adapter);
    await vs.download(fakeServer, 'top.md');
    ok('runner · a file at the vault root needs no folder at all', !!adapter._files['top.md']);
  })();

  await (async () => {
    // A folder that is already there is not created twice, and does not throw.
    const adapter = mobileAdapter();
    const vs = runner(adapter);
    await vs.ensureLocalFolder('a/b');
    await vs.ensureLocalFolder('a/b');
    ok('runner · creating a folder that exists is not an error', !!adapter._folders['a/b']);
  })();

  await (async () => {
    // What the failure now READS like: the folder that could not be made, by
    // name. The old one surfaced the adapter's own ENOENT and nothing else.
    const adapter = mobileAdapter();
    adapter.mkdir = async () => { throw new Error('EACCES'); };
    const vs = runner(adapter);
    let message = '';
    try { await vs.ensureLocalFolder('Tasks/Items'); } catch (e) { message = e.message; }
    ok('runner · a folder that truly cannot be made says which one',
       message.indexOf('Tasks') >= 0 && message.indexOf('EACCES') >= 0, message);
  })();
}


// ── the first run of a second device ───────────────────────────────────────
/* The field bug: a vault already on both sides, every file with a different
   time on the server (it stamps the upload, not the edit). Judged by time
   alone, the first run of the second device made a conflict copy of the whole
   vault — 217 of them, 192 byte-identical to their original. */
{
  const f = (mtime, size) => ({ mtime, size });
  eq('first run · same size, far apart in time → compare the bytes',
     S.decide('a', f(1000, 10), f(900000, 10), null).action, 'compare');
  eq('first run · a different size is a real conflict',
     S.decide('a', f(1000, 10), f(900000, 11), null).action, 'conflict');
  const agree = S.decide('a', f(1000, 10), f(1500, 10), null);
  ok('first run · close enough in time needs nothing and gets a record',
     agree.action === 'none' && agree.adopt === true, JSON.stringify(agree));
  // The same holds later: Syncthing (or a copy) brings the same edit both ways.
  const base = { local: f(1000, 10), remote: f(5000, 10) };
  eq('later · edited to the same size on both sides is compared, not a conflict',
     S.decide('a', f(70000, 12), f(99000, 12), base).action, 'compare');
  const plan = S.planSync({ 'x.md': f(1000, 4), 'y.md': f(1000, 4) }, { 'x.md': f(1000, 4), 'y.md': f(800000, 4) }, {});
  eq('plan · agreeing files are adopted', plan.adopt, ['x.md']);
  eq('plan · the rest is compared', plan.compare.map(v => v.path), ['y.md']);
  eq('plan · and counted as work', S.planSize(plan), 1);
}

// ── field test 2026-10-11: same-size edits a moment apart ──────────────────
/* Laptop and tablet each appended one line of the same length to Welcome.md,
   0.3 s apart. Both sides had a record, both changed, same size, times within
   two seconds — and decide() adopted them as equal without looking. Laptop and
   tablet then kept different text and every later run said "nothing to do". */
{
  const f = (mtime, size) => ({ mtime, size });

  const R = window.vaultSyncRunLib;
  const enc = (text) => new TextEncoder().encode(text).buffer;

  function memoryVault(files) {
    const store = {};
    for (const [path, text] of Object.entries(files)) store[path] = { bytes: enc(text), mtime: 1000 };
    // Every write is a later moment, as on a real disk: a same-size edit has
    // to be visible by its time.
    let clock = 2000;
    const tick = () => (clock += 10000);
    const folderOf = (p) => (p.indexOf('/') >= 0 ? p.slice(0, p.lastIndexOf('/')) : '');
    return {
      _store: store,
      async list(folder) {
        const files = [], folders = new Set();
        for (const p of Object.keys(store)) {
          const parent = folderOf(p);
          if (parent === folder) files.push(p);
          else if (folder === '' ? true : parent.indexOf(folder + '/') === 0) {
            const rest = folder === '' ? p : p.slice(folder.length + 1);
            folders.add((folder ? folder + '/' : '') + rest.split('/')[0]);
          }
        }
        return { files, folders: Array.from(folders) };
      },
      async stat(p) { return store[p] ? { mtime: store[p].mtime, size: store[p].bytes.byteLength } : null; },
      async readBinary(p) { if (!store[p]) throw new Error('no ' + p); return store[p].bytes; },
      async writeBinary(p, bytes) { store[p] = { bytes, mtime: tick() }; },
      async read(p) { if (!store[p]) throw new Error('no ' + p); return new TextDecoder().decode(store[p].bytes); },
      async write(p, text) { store[p] = { bytes: enc(text), mtime: tick() }; },
      async exists(p) { return !!store[p] || Object.keys(store).some(k => k.indexOf(p + '/') === 0); },
      async mkdir() {},
      async remove(p) { delete store[p]; },
    };
  }
  function fakeServer(files, opts) {
    const o = opts || {};
    const store = {};
    let clock = 500000;
    for (const [path, text] of Object.entries(files)) store[path] = { bytes: enc(text), mtime: clock };
    return {
      _store: store,
      async listTree(path, skip) {
        return Object.keys(store).filter(p => !skip(p, false))
          .map(p => ({ path: p, mtime: store[p].mtime, size: store[p].bytes.byteLength, folder: false }));
      },
      async get(p) { return store[p] ? { arrayBuffer: store[p].bytes } : null; },
      async put(p, bytes) {
        if (o.refuseZip && /\.zip$/.test(p)) throw new Error('uploading "' + p + '" failed with 413');
        store[p] = { bytes: typeof bytes === 'string' ? enc(bytes) : bytes, mtime: (clock += 60000) };
      },
      async ensureFolder() {}, async remove(p) { delete store[p]; },
      // The backup side: a server-side copy beside the vault, and the old _backups.
      baseUrl: 'https://cloud.example/dav/Obsidian/nexus', username: 'u', password: 'p',
      copies: [], moves: [], old: o.old || [],
      async list(p) { return p === '_backups' ? this.old.map(n => ({ path: '_backups/' + n, folder: false })) : []; },
      async copy(p, dest) {
        if (o.refuseCopy) throw new Error('copy of "/" failed with 507');
        const name = decodeURIComponent(dest.split('/').pop());
        if (this.store && this.store.names.indexOf(name) >= 0) return false;
        this.copies.push(dest); if (this.store) this.store.names.push(name); return true;
      },
      async move(p, dest) {
        const name = decodeURIComponent(dest.split('/').pop());
        if (this.store && this.store.names.indexOf(name) >= 0) return false;
        this.moves.push([p, dest]); this.old = this.old.filter(n => '_backups/' + n !== p);

  function fakeBackupStore(names, server) {
    const store = { names: names.slice(), removed: [], renamed: [],
      async request(m) { return { status: 201 }; },
      async has(n) { return this.names.indexOf(n) >= 0; },
      async list() { return this.names.map(n => ({ path: n, folder: true })); },
      async remove(n) { this.removed.push(n); this.names = this.names.filter(x => x !== n); },
      async move(n, dest) {
        const to = decodeURIComponent(dest.split('/').pop());
        if (this.names.indexOf(to) >= 0) return false;
        this.names = this.names.map(x => (x === n ? to : x)); this.renamed.push([n, to]); return true;

    // A change on the tablet lands after the run's index, before its end.
    const realReconcile = tablet.vs.reconcile.bind(tablet.vs);
    tablet.vs.reconcile = async (...a) => {
      tablet.plugin.settings.vaultSync.keepBackups = 11;
      await tablet.plugin.saveSettings();
      return realReconcile(...a);
    };
    laptop.plugin.settings.vaultSync.exclude = ['Other/']; await laptop.plugin.saveSettings();
    await laptop.vs.syncNow(false);
    await tablet.vs.syncNow(false);
    tablet.vs.reconcile = realReconcile;
    const state = JSON.parse(await tabletVault.read(tablet.vs.statePath));
    ok('base · a change made during the run is not in the base', state.settingsBase.vaultSync.keepBackups !== 11, JSON.stringify(state.settingsBase.vaultSync));
    laptop.plugin.settings.vaultSync.backup = true; laptop.plugin.settings.vaultSync.backup = false;
    laptop.plugin.settings.vaultSync.exclude = ['Other/', 'More/']; await laptop.plugin.saveSettings();
    await laptop.vs.syncNow(false);
    const next = await tablet.vs.syncNow(false);
    eq('base · so the next merge keeps it', tablet.plugin.settings.vaultSync.keepBackups, 11);
    eq('base · without calling it a clash', next.settingsClashes, []);
  })();

  await (async () => {
    // Reviewer finding (2b): with config sync off data.json is not carried,
    // so no base may be recorded for it.
    const vault = memoryVault({ 'a.md': 'a' });
    const dev = await realDevice(vault, fakeServer({}), 'dev-e');
    dev.plugin.settings.vaultSync.config = false;
    await dev.vs.syncNow(false);
    const state = JSON.parse(await vault.read(dev.vs.statePath));
    eq('base · config sync off records no settings base', state.settingsBase, undefined);
  })();

  await (async () => {
    // Reviewer finding: adopting a file from an older device ran the
    // tasks-module cleanup, which deletes THIS device's credentials.
    const dev = await realDevice(memoryVault({}), fakeServer({}), 'dev-f');
    window.localStorage.setItem(dev.plugin.credKey('old-acct'), '{"secret":"x"}');
    await dev.plugin.adoptIncomingSettings({ tasksCalendar: { accounts: [{ id: 'old-acct' }] } }, undefined);
    ok('adopt · an old file does not delete this device\'s credentials', !!window.localStorage.getItem(dev.plugin.credKey('old-acct')));
    window.localStorage.removeItem(dev.plugin.credKey('old-acct'));
  })();

  await (async () => {
    // Reviewer finding (1): a save that starts while the file is being read
    // makes the read stale; taking it rolled the save back.
    const vault = memoryVault({});
    const dev = await realDevice(vault, fakeServer({}), 'dev-g');
    await dev.plugin.saveSettings();
    const stale = JSON.parse(await vault.read(OWN));
    stale.vaultSync.keepBackups = 77;                       // what the slow read returns
    dev.plugin.loadData = async () => {
      dev.plugin.settings.vaultSync.keepBackups = 12;       // the user's toggle, mid-read
      await dev.plugin.saveSettings();
      return stale;
    };
    await dev.plugin.onExternalSettingsChange();
    eq('race · a save during the read is not rolled back', dev.plugin.settings.vaultSync.keepBackups, 12);
  })();

  await (async () => {
    // Reviewer finding: a broken data.json on the server failed every run, for ever.
    const server = fakeServer({ [OWN]: '[1, 2' });
    const vault = memoryVault({});
    const dev = await realDevice(vault, server, 'dev-c');
    const report = await dev.vs.syncNow(false);
    eq('broken · no failure', report.failed, 0);
    ok('broken · the server now has this device\'s settings', !!(file(server._store).devices || {})['dev-c']);
    const arrayServer = fakeServer({ [OWN]: '[]' });
    const dev2 = await realDevice(memoryVault({}), arrayServer, 'dev-d');
    await dev2.vs.syncNow(false);
    ok('broken · an array is not a settings file either', !Array.isArray(file(arrayServer._store)));
  })();

  await (async () => {
    // A config file on the compare path: same size, other bytes.
    const vault = memoryVault({ '.obsidian/app.json': '{"a":1}' });
    const server = fakeServer({ '.obsidian/app.json': '{"b":2}' });
    const vs = runnerFor(vault, server);
    const report = await vs.syncNow(false);
    eq('config · same size, other bytes: no copy either', Object.keys(vault._store).filter(p => /\(conflict/.test(p)), []);
    eq('config · and not announced', report.conflicts, 0);
    eq('config · but counted as the download it was', report.downloaded, 1);
  })();

  await (async () => {
    const vault = memoryVault({ 'a.md': 'a', '.obsidian/plugins/nexus-suite/sync-state.json': '{"files":{}}' });
    const vs = runnerFor(vault, fakeServer({}));
    await vs.syncNow(false);
    ok('legacy · the old shared state file is removed', !vault._store['.obsidian/plugins/nexus-suite/sync-state.json']);
    ok('legacy · and this device\'s own is there', !!vault._store[vs.statePath]);
  })();

  await (async () => {
    // A file that fails on every run is announced once, not every minute.
    const vault = memoryVault({ 'ok.md': 'fine', 'bad.md': 'broken' });
    const server = fakeServer({});
    const put = server.put;
    server.put = async (p, b) => { if (p === 'bad.md') throw new Error('uploading "bad.md" failed with 403'); return put(p, b); };
    const vs = runnerFor(vault, server);
    window.__notices = [];
    await vs.syncNow(false);
    await vs.syncNow(false);
    await vs.syncNow(false);
    eq('failures · three runs, the same failure, one notice', (window.__notices || []).length, 1);
    ok('failures · which names the failure', /1 failed/.test((window.__notices || [])[0] || ''), (window.__notices || [])[0]);
  })();

  await (async () => {
    // Many conflicts, one toast.
    const notes = {}, theirs = {};
    for (let i = 0; i < 12; i++) { notes['c' + i + '.md'] = 'mine ' + i; theirs['c' + i + '.md'] = 'their ' + i + ' longer'; }
    const vs = runnerFor(memoryVault(notes), fakeServer(theirs));
    window.__notices = [];
    const report = await vs.syncNow(false);
    eq('notices · twelve conflicts', report.conflicts, 12);
    eq('notices · are one Notice, not twelve', (window.__notices || []).length, 1);
  })();
}

// ── per-device settings ────────────────────────────────────────────────────
/* The bug: data.json is a file in the vault, so the vault sync uploads it and
   the other device downloads it — over its own settings, device name included.
   The fix is not to stop syncing the file (notes and settings should travel);
   it is to key what belongs to one machine by that machine's id. */
{
  const D = window.deviceSettingsLib;
  const live = () => ({
    vaultSync: { enabled: true, url: 'https://cloud.example/dav/Vault', deviceName: 'Desktop',
                 onStart: true, intervalMin: 15, config: true, exclude: ['Archive/'] },
  });

  const settings = live();
  ok('device · the migration reports that it ran', D.migrateDeviceSettings(settings, 'dev-a') === true);
  const bag = settings.devices['dev-a'];
  eq('device · the server URL is this device\'s now', bag.vaultSyncUrl, 'https://cloud.example/dav/Vault');
  eq('device · so is the name it calls itself', bag.vaultSyncDeviceName, 'Desktop');
  eq('device · and the schedule', [bag.vaultSyncOnStart, bag.vaultSyncIntervalMin], [true, 15]);
  ok('device · shared policy is NOT moved',
     bag.config === undefined && bag.exclude === undefined && settings.vaultSync.config === true);
  /* Left in place on purpose: the second device reads the same data.json and
     still has to find them when it updates. */
  ok('device · the old key is left where it was', settings.vaultSync.url === 'https://cloud.example/dav/Vault');

  bag.vaultSyncDeviceName = 'Tablet';
  ok('device · a second run does nothing', D.migrateDeviceSettings(settings, 'dev-a') === false);
  eq('device · and does not overwrite what the device set since', bag.vaultSyncDeviceName, 'Tablet');

  bag.vaultSyncUrl = '';
  D.migrateDeviceSettings(settings, 'dev-a');
  eq('device · a server someone removed does not come back', bag.vaultSyncUrl, '');

  D.migrateDeviceSettings(settings, 'dev-b');
  eq('device · the other device migrates its own copy from the same file',
     settings.devices['dev-b'].vaultSyncUrl, 'https://cloud.example/dav/Vault');
  eq('device · without disturbing the first', settings.devices['dev-a'].vaultSyncUrl, '');

  // The three-way merge, on its own.
  const baseFile = { look: { theme: 'a', size: 1 }, list: [1], devices: {} };
  const mineFile = { look: { theme: 'b', size: 1 }, list: [1], devices: { me: { u: 1 } } };
  const theirFile = { look: { theme: 'a', size: 2 }, list: [1, 2], devices: { you: { u: 2 } } };
  const m = D.mergeIncoming(theirFile, mineFile, 'me', baseFile);
  eq('merge · a key only I changed is mine, one only they changed is theirs', [m.merged.look, m.merged.list], [{ theme: 'b', size: 2 }, [1, 2]]);
  eq('merge · both bags', Object.keys(m.merged.devices).sort(), ['me', 'you']);
  eq('merge · no clash', m.clashes, []);
  const c = D.mergeIncoming({ look: { theme: 'c' } }, { look: { theme: 'b' } }, 'me', { look: { theme: 'a' } });
  eq('merge · both changed the same key: theirs, reported', [c.merged.look.theme, c.clashes], ['c', ['look.theme']]);
  const j = D.mergeIncoming({ look: { theme: 'c' }, x: 1 }, { look: { theme: 'b' }, only: 'mine' }, 'me');
  eq('merge · no base: theirs wins, my extra keys stay, the difference is reported', [j.merged.look.theme, j.merged.only, j.clashes], ['c', 'mine', ['look.theme']]);
  const lists = D.mergeIncoming({ x: { exclude: ['a', 'c'] } }, { x: { exclude: ['a', 'b'] } }, 'me', { x: { exclude: ['a'] } });
  eq('merge · a list both sides added to keeps both additions', [lists.merged.x.exclude, lists.clashes], [['a', 'c', 'b'], []]);
  const removed = D.mergeIncoming({ x: { exclude: ['a', 'c'] } }, { x: { exclude: [] } }, 'me', { x: { exclude: ['a'] } });
  eq('merge · and a removal here is kept too', removed.merged.x.exclude, ['c']);
  // In place, all the way down: a card a modal holds stays the live card.
  const held = { homepage: { widgets: [{ uid: 'w1', title: 'old' }], name: 'x' }, gone: 1 };
  const card = held.homepage.widgets[0], list = held.homepage.widgets;
  D.assignInPlace(held, { homepage: { widgets: [{ uid: 'w1', title: 'new' }], name: 'y' } });
  ok('in place · the same card object, with the new title', held.homepage.widgets[0] === card && card.title === 'new' && held.homepage.widgets === list);
  ok('in place · a key the new file lacks is gone', !('gone' in held));
  const shared = ['a', 'b'];
  const sharer = { k: shared };
  D.assignInPlace(sharer, { k: shared });
  eq('in place · a list shared by both sides (a default) is not emptied', shared, ['a', 'b']);
  const own = D.mergeIncoming({ homepage: { profiles: { me: 'old', you: 'y' } } }, { homepage: { profiles: { me: 'new' } } }, 'me', { homepage: { profiles: { me: 'base' } } });
  eq('merge · my dashboard is mine, theirs is theirs', own.merged.homepage.profiles, { me: 'new', you: 'y' });

  const fresh = { vaultSync: {} };
  D.migrateDeviceSettings(fresh, 'dev-new');
  eq('device · a fresh install migrates nothing but is marked done',
     Object.keys(fresh.devices['dev-new']), ['migrated']);
}

// ── the round trip that used to lose a device's settings ───────────────────
{
  const Suite = window.NexusSuite;
  const loaded = async (raw, deviceId) => {
    const plugin = new Suite({ workspace: {}, vault: {} }, {});
    plugin.loadData = async () => JSON.parse(JSON.stringify(raw));
    plugin.saveData = async () => {};
    plugin._deviceId = deviceId;      // the real one would ask localStorage
    await plugin.loadSettings();
    return plugin;
  };
  const asFile = (plugin) => JSON.parse(JSON.stringify(plugin.settings));

  const desktop = await loaded({ vaultSync: { url: 'https://cloud.example/dav', deviceName: 'Desktop' } }, 'dev-desktop');
  eq('round trip · the desktop migrated its connection', desktop.deviceSetting('vaultSyncDeviceName', ''), 'Desktop');
  await desktop.setDeviceSetting('vaultSyncIntervalMin', 5);

  const tablet = await loaded(asFile(desktop), 'dev-tablet');
  await tablet.setDeviceSetting('vaultSyncDeviceName', 'Tablet');
  await tablet.setDeviceSetting('vaultSyncIntervalMin', 60);
  eq('round trip · the tablet has its own name', tablet.deviceSetting('vaultSyncDeviceName', ''), 'Tablet');

  const desktopAgain = await loaded(asFile(tablet), 'dev-desktop');
  eq('round trip · and the desktop still has ITS name after the tablet wrote data.json',
     desktopAgain.deviceSetting('vaultSyncDeviceName', ''), 'Desktop');
  eq('round trip · and its own interval', desktopAgain.deviceSetting('vaultSyncIntervalMin', 15), 5);
  eq('round trip · while the tablet keeps its own',
     desktopAgain.settings.devices['dev-tablet'].vaultSyncIntervalMin, 60);

  /* An incoming data.json that never heard of this device (the server's copy,
     uploaded by the laptop before the tablet joined) must not cost the tablet
     its connection — not in memory, and not after a reload from disk. */
  const tabletAlone = await loaded({ vaultSync: { url: '' } }, 'dev-tablet2');
  await tabletAlone.setDeviceSetting('vaultSyncUrl', 'https://cloud.example/dav');
  let saved = null;
  tabletAlone.saveData = async (value) => { saved = JSON.parse(JSON.stringify(value)); };
  const adopted = await tabletAlone.adoptIncomingSettings(asFile(desktopAgain));
  ok('adopt · a file without this device\'s bag asks to be sent back', adopted.sendBack === true);
  eq('adopt · the connection survives in memory', tabletAlone.deviceSetting('vaultSyncUrl', ''), 'https://cloud.example/dav');
  eq('adopt · and in what was saved', saved.devices['dev-tablet2'].vaultSyncUrl, 'https://cloud.example/dav');
  ok('adopt · the other devices\' bags came along', !!saved.devices['dev-desktop']);
  ok('adopt · a file that already says what this device holds is not sent back',
     (await tabletAlone.adoptIncomingSettings(JSON.parse(JSON.stringify(saved)))).sendBack === false);
  /* Obsidian mobile calls onExternalSettingsChange for the plugin's own
     writes. The plugin's own file must not trigger another save (86 calls in
     7 s on the tablet), and nothing is taken while a save is under way. */
  let saves = 0;
  tabletAlone.saveData = async (value) => { saves++; saved = JSON.parse(JSON.stringify(value)); };
  tabletAlone.loadData = async () => JSON.parse(JSON.stringify(saved));
  await tabletAlone.saveSettings(); saves = 0;
  await tabletAlone.onExternalSettingsChange();
  await tabletAlone.onExternalSettingsChange();
  eq('external · the plugin\'s own file does not trigger another save', saves, 0);
  // Memory ahead of the file (a second change while the first save is out):
  // the file is compared with what was WRITTEN, so it is still left alone.
  tabletAlone.settings.vaultSync.keepBackups = 44;
  await tabletAlone.onExternalSettingsChange();
  eq('external · a change not yet saved is not rolled back', tabletAlone.settings.vaultSync.keepBackups, 44);
  tabletAlone._settingsWrites = 1;
  tabletAlone.loadData = async () => ({ shared: 'during a save' });
  await tabletAlone.onExternalSettingsChange();
  tabletAlone._settingsWrites = 0;
  ok('external · nothing is taken while a save is under way', tabletAlone.settings.shared === undefined);
  await tabletAlone.saveSettings(); saves = 0;
  tabletAlone.loadData = async () => Object.assign(JSON.parse(JSON.stringify(saved)), { devices: { 'dev-desktop': { vaultSyncDeviceName: 'Desktop' } }, shared: 1 });
  await tabletAlone.onExternalSettingsChange();
  eq('external · a really different file is taken, keeping this device\'s bag',
     [saves, tabletAlone.settings.shared, tabletAlone.deviceSetting('vaultSyncUrl', '')], [1, 1, 'https://cloud.example/dav']);
  eq('external · and this device\'s unsaved-then-saved change survives it', tabletAlone.settings.vaultSync.keepBackups, 44);
  const reloaded = await loaded(saved, 'dev-tablet2');
  eq('adopt · and a reload from disk still has it', reloaded.deviceSetting('vaultSyncUrl', ''), 'https://cloud.example/dav');

  // The startup toggle became a three-way choice.
  const oldOn = await loaded({ homepage: { openOnStartup: true } }, 'dev-x');
  eq('round trip · openOnStartup true became "tab"', oldOn.settings.homepage.startup, 'tab');
  const oldOff = await loaded({ homepage: { openOnStartup: false } }, 'dev-x');
  eq('round trip · and false became "off"', oldOff.settings.homepage.startup, 'off');
  eq('round trip · the old key is gone', oldOff.settings.homepage.openOnStartup, undefined);
}

// ── what the sync still refuses to carry ───────────────────────────────────
/* The device store only works because data.json keeps travelling: the fix must
   NOT be an extra exclusion. These four are the ones that stay excluded. */
{
  const skip = S.makeSkip({ config: true });
  eq('skip · the device files are still exactly four', S.DEVICE_FILES.length, 4);
  ok('skip · and every one of them is refused', S.DEVICE_FILES.every(path => skip(path)));
  ok('skip · while the plugin\'s own settings still travel',
     !skip('.obsidian/plugins/nexus-suite/data.json'));
}

} catch (e) { out.push('THREW: ' + (e && e.stack || e)); fail++; }
if (window.__err && window.__err.length) out.push('LOAD ERROR: ' + window.__err.join('\n'));
out.push('');
out.push(fail === 0 ? ('ALL GREEN — ' + pass + ' checks') : (fail + ' FAILED of ' + (pass + fail)));
document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body></html>
