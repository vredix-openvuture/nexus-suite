<script>
const out = []; let pass = 0, fail = 0;
function ok(n, c, d) { if (c) { pass++; out.push('PASS  ' + n); } else { fail++; out.push('FAIL  ' + n + (d ? '  →  ' + d : '')); } }
function eq(n, g, w) { const a = JSON.stringify(g), b = JSON.stringify(w); ok(n, a === b, 'got ' + a + ' want ' + b); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

(async () => {
try {
const K = window.kanbanLib;
const B = window.boardLib;
const TFile = window.obsidianStub.TFile;

const NOTE = [
  '# Board note',
  '',
  '```nexus-kanban',
  'title: Roadmap',
  '## Backlog',
  '- [ ] First card',
  '## Doing',
  '## Done',
  '```',
  '',
  'Text below the board.',
].join('\n');

/* A vault just real enough: files, read, modify. */
function makeApp(text) {
  const file = new TFile();
  file.path = 'Board.md';
  file.basename = 'Board';
  const store = { 'Board.md': { file, text } };
  return {
    _store: store,
    vault: {
      getAbstractFileByPath(p) { return store[p] ? store[p].file : null; },
      async read(f) { return store[f.path].text; },
      async modify(f, next) { store[f.path].text = next; },
      async create(p, t) { const nf = new TFile(); nf.path = p; store[p] = { file: nf, text: t }; return nf; },
      adapter: { async exists() { return true; }, async mkdir() {} },
    },
    metadataCache: { getFirstLinkpathDest: (name) => (store[name + '.md'] ? store[name + '.md'].file : null) },
    workspace: { getLeaf: () => ({ openFile() {} }) },
    fileManager: { async processFrontMatter() {} },
  };
}

/* Live preview: Obsidian re-derives the block's line span from the CURRENT
   text every time it is asked. */
function freshCtx(app) {
  return {
    sourcePath: 'Board.md',
    getSectionInfo() {
      const lines = app._store['Board.md'].text.split('\n');
      const start = lines.findIndex(l => l.trim().indexOf('```nexus-kanban') === 0);
      if (start < 0) return null;
      let end = start + 1;
      while (end < lines.length && lines[end].trim().indexOf('```') !== 0) end++;
      return { text: app._store['Board.md'].text, lineStart: start, lineEnd: end };
    },
  };
}
/* Reading mode: the span is whatever it was when the block was first rendered,
   and it does NOT follow edits made underneath it. */
function staleCtx(app) {
  const snapshot = freshCtx(app).getSectionInfo();
  return { sourcePath: 'Board.md', getSectionInfo() { return snapshot; } };
}

function board(app, ctx) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const el = stage.createDiv();
  // NexusKanban takes the PLUGIN, and reads app + settings off it.
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  kb.render(app._store['Board.md'].text.split('\n').slice(3, 8).join('\n'), el, ctx);
  return { kb, el };
}
function blockOf(app) {
  const lines = app._store['Board.md'].text.split('\n');
  const start = lines.findIndex(l => l.trim().indexOf('```nexus-kanban') === 0);
  let end = start + 1;
  while (end < lines.length && lines[end].trim().indexOf('```') !== 0) end++;
  return lines.slice(start + 1, end);
}
async function addCard(el, columnIndex, title) {
  const col = el.querySelectorAll('.nx-kb-col')[columnIndex];
  const input = col.querySelector('.nx-kb-add-input');
  input.value = title;
  const ev = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true });
  input.dispatchEvent(ev);
  await sleep(0);
}

// ── the parser round trips ─────────────────────────────────────────────────
{
  const src = 'title: Roadmap\n## Backlog\n- [ ] First card\n## Doing\n## Done';
  const cfg = K.parseKanban(src);
  eq('parse · three columns', cfg.buckets.map(b => b.title), ['Backlog', 'Doing', 'Done']);
  eq('parse · one card', cfg.buckets[0].cards.map(c => c.text), ['First card']);
  eq('parse · and it round trips', K.stringifyKanban(cfg).trim(), src.trim());
}

// ── the reported bug: only one card per column ─────────────────────────────
{
  const app = makeApp(NOTE);
  const ctx = freshCtx(app);
  let { el } = board(app, ctx);
  await addCard(el, 1, 'Alpha');
  await sleep(0);
  eq('live · the first card is written', blockOf(app).filter(l => l.indexOf('Alpha') >= 0).length, 1);
  await addCard(el, 1, 'Beta');
  await sleep(0);
  const block = blockOf(app);
  eq('live · and so is the second', block.filter(l => l.indexOf('Beta') >= 0).length, 1);
  ok('live · without losing the first', block.some(l => l.indexOf('Alpha') >= 0), block.join('|'));
  ok('live · and the fence is still intact',
     app._store['Board.md'].text.split('\n').filter(l => l.trim() === '```').length === 1,
     app._store['Board.md'].text);
  ok('live · the note below the board survived',
     app._store['Board.md'].text.indexOf('Text below the board.') > 0);
}

// ── the same thing where the line span does not follow edits ───────────────
{
  const app = makeApp(NOTE);
  const ctx = staleCtx(app);
  const { el } = board(app, ctx);
  await addCard(el, 1, 'Alpha');
  await sleep(0);
  await addCard(el, 1, 'Beta');
  await sleep(0);
  const text = app._store['Board.md'].text;
  const block = blockOf(app);
  ok('stale · both cards are on the board', block.some(l => l.indexOf('Alpha') >= 0) && block.some(l => l.indexOf('Beta') >= 0),
     block.join('|'));
  ok('stale · the fence is not duplicated', text.split('\n').filter(l => l.trim() === '```').length === 1, text);
  ok('stale · and nothing outside the block was eaten', text.indexOf('Text below the board.') > 0, text);
}

// ── a card can be pointed at a note that already exists ────────────────────
{
  const app = makeApp(NOTE);
  const existing = new TFile();
  existing.path = 'Kanban module.md';
  existing.basename = 'Kanban module';
  app._store['Kanban module.md'] = { file: existing, text: '# Kanban module' };
  const ctx = freshCtx(app);
  const { kb, el } = board(app, ctx);
  ok('link · the board can resolve an existing note', !!kb.noteByName('Kanban module'));

  const cfg = K.parseKanban(K.stringifyKanban(K.parseKanban('## Backlog\n- [ ] [[Kanban module|Kanban]] @2026-08-25 #plugin')));
  const card = cfg.buckets[0].cards[0];
  eq('link · the link is parsed off the card', card.link, 'Kanban module');
  eq('link · with its alias', card.alias, 'Kanban');
  eq('link · its due date', card.due, '2026-08-25');
  eq('link · and its tags', card.tags, ['plugin']);
  eq('link · the title shown is the alias', K.cardTitle(card), 'Kanban');
  eq('link · and it round trips', K.cardLine(card).trim(), '- [ ] [[Kanban module|Kanban]] @2026-08-25 #plugin');
  void el;
}

// ── editing a card ─────────────────────────────────────────────────────────
{
  const app = makeApp(NOTE);
  const ctx = freshCtx(app);
  const { el } = board(app, ctx);
  const card = el.querySelector('.nx-kb-card');
  ok('edit · the card is on the board', !!card);
  const menu = card.querySelector('.nx-kb-card-menu');
  ok('edit · and it has a menu to edit it with', !!menu);
  const box = card.querySelector('.nx-kb-check');
  box.checked = true;
  box.dispatchEvent(new Event('change', { bubbles: true }));
  await sleep(0);
  ok('edit · ticking it writes through to the note',
     blockOf(app).some(l => l.indexOf('- [x] First card') >= 0), blockOf(app).join('|'));
}


// ── the reported bug, reproduced: the element is detached after the first
//    save, so getSectionInfo stops answering and every later edit was lost ──
{
  const app = makeApp(NOTE);
  let answers = 0;
  const ctx = {
    sourcePath: 'Board.md',
    getSectionInfo() {
      // Obsidian re-renders the block after the first write, which detaches the
      // element the handlers are bound to. From then on it returns null.
      if (answers++ > 0) return null;
      return freshCtx(app).getSectionInfo();
    },
  };
  const { el } = board(app, ctx);
  await addCard(el, 1, 'Alpha');
  await sleep(0);
  await addCard(el, 1, 'Beta');
  await sleep(0);
  await addCard(el, 2, 'Gamma');
  await sleep(0);
  const block = blockOf(app);
  ok('detached · the first card is saved', block.some(l => l.indexOf('Alpha') >= 0), block.join('|'));
  ok('detached · and so is the second', block.some(l => l.indexOf('Beta') >= 0), block.join('|'));
  ok('detached · and one in another column', block.some(l => l.indexOf('Gamma') >= 0), block.join('|'));
  ok('detached · the fence is intact',
     app._store['Board.md'].text.split('\n').filter(l => l.trim() === '```').length === 1);
  ok('detached · and the text below the board is untouched',
     app._store['Board.md'].text.indexOf('Text below the board.') > 0);
}

// ── two boards in one note must not overwrite each other ───────────────────
{
  const TWO = [
    '```nexus-kanban',
    'title: First',
    '## A',
    '- [ ] one',
    '```',
    '',
    'Between them.',
    '',
    '```nexus-kanban',
    'title: Second',
    '## B',
    '- [ ] two',
    '```',
  ].join('\n');
  const app = makeApp(TWO);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const el = stage.createDiv();
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  // Render the SECOND board, and give it a context that has already gone stale.
  kb.render('title: Second\n## B\n- [ ] two', el, { sourcePath: 'Board.md', getSectionInfo: () => null });
  await addCard(el, 0, 'added');
  await sleep(0);
  const text = app._store['Board.md'].text;
  ok('two boards · the card landed in the second board',
     text.indexOf('title: Second') < text.indexOf('added'), text);
  ok('two boards · the first board is untouched', text.indexOf('- [ ] one') > 0, text);
  ok('two boards · and its title survives', text.indexOf('title: First') > 0, text);
  ok('two boards · both fences are still there',
     text.split('\n').filter(l => l.trim() === '```').length === 2, text);
}

// ── locateBlock on its own ─────────────────────────────────────────────────
{
  const app = makeApp(NOTE);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const lines = NOTE.split('\n');
  const body = 'title: Roadmap\n## Backlog\n- [ ] First card\n## Doing\n## Done';
  eq('locate · by body, with no help at all', kb.locateBlock(lines, body, null), { start: 2, end: 8 });
  eq('locate · a body nobody wrote, with one board, still resolves',
     kb.locateBlock(lines, 'nonsense', null), { start: 2, end: 8 });
  eq('locate · nothing to find in a note with no board',
     kb.locateBlock(['# just text', ''], 'anything', null), null);
}

// ── card descriptions ──────────────────────────────────────────────────────
/* The board is ONE hand-editable text, so a description has to be a shape a
   person would write by hand and the parser has to give it back unchanged. */
{
  const src = [
    'title: Roadmap',
    '## Backlog',
    '- [ ] First card',
    '  the first line of the description',
    '  and a second one',
    '- [ ] Second card',
    '## Done',
  ].join('\n');

  eq('desc · an indented line under a card belongs to it',
     cards[0].desc, 'the first line of the description\nand a second one');
  eq('desc · the next card is a card, not more description', cards[1].text, 'Second card');
  eq('desc · and it has none of its own', cards[1].desc, '');
  eq('desc · it round trips', K.stringifyKanban(cfg).trim(), src.trim());
  eq('desc · a card without one writes no extra line',
     K.cardLines({ done: false, link: '', alias: '', text: 'Bare', desc: '', due: '', tags: [] }),
     ['- [ ] Bare']);
  eq('desc · one with a description writes it indented',
     K.cardLines({ done: false, link: '', alias: '', text: 'Full', desc: 'a\nb', due: '', tags: [] }),
     ['- [ ] Full', '  a', '  b']);
}
{
  // An indented checklist line is still a card of its own — the check for a
  // description runs after the card parser, never before it.
  const cfg = K.parseKanban(['## Backlog', '- [ ] Outer', '  - [ ] Indented'].join('\n'));
  eq('desc · an indented checklist line stays a card',
     cfg.buckets[0].cards.map(c => c.text), ['Outer', 'Indented']);
  eq('desc · so it is not swallowed as a description', cfg.buckets[0].cards[0].desc, '');
}
{
  // A stray indent with no card above it is somebody's own text: kept where it
  // was, never glued onto a card further up.
  const cfg = K.parseKanban(['## Backlog', '  a note to self', '- [ ] Card'].join('\n'));
  eq('desc · an indent with no card above it is left alone', cfg.buckets[0].cards[0].desc, '');
  ok('desc · and is kept as the column\'s own text',
     cfg.buckets[0].extra.join('|').indexOf('a note to self') >= 0, cfg.buckets[0].extra.join('|'));
}
{
  const KC = window.kanbanCardLib;
  eq('card editor · tags are typed with or without a #', KC.parseTags('#plugin, later  #ui'),
     ['plugin', 'later', 'ui']);
  eq('card editor · nothing typed is no tags', KC.parseTags('   '), []);
  eq('card editor · a blank line cannot survive the block, so it is dropped',
     KC.cleanDescription('one\n\n  \ntwo  '), 'one\ntwo');
}

/* ══ ONE BLOCK, TWO SOURCES ═══════════════════════════════════════════════
   The block source is what every board written so far silently is, so its
   text has to survive the merge untouched; the folder source is the new one
   and has to write its moves into the NOTES, not into the fence. */

// ── the block source is unchanged ──────────────────────────────────────────
{
  const full = [

    'template: Templates/Card',
    'compact: true',
    'due: false',

  eq('block · so does the description', cfg.buckets[0].cards[0].desc, 'a description line');
  // `folder:` was the old spelling of `notes:` and boards in the wild use it.

  eq('block · and never becomes a query', K.parseKanban('folder: Projects').folder, '');
}

// ── one column kind vocabulary, both boards ───────────────────────────────
{
  const cases = [
    ['Backlog', 'open'], ['Offen', 'open'], ['Ideas', 'open'],
    ['In Arbeit', 'doing'], ['Doing', 'doing'], ['In progress', 'doing'],
    ['Aktiv', 'doing'], ['WIP', 'doing'], ['Lernen', 'doing'],
    ['Wartet', 'wait'], ['Blocked', 'wait'], ['Review', 'wait'],
    ['Pausiert', 'wait'], ['Prüfen', 'wait'],
    // Every German word the merge kept has to answer in English too — the
    // board is bilingual or it is a trap.
    ['Waiting', 'wait'], ['Later', 'wait'], ['Später', 'wait'],
    ['Active', 'doing'], ['Running', 'doing'],
    // The folder board's own words, which the block board never knew.
    ['Ausbessern', 'wait'], ['Fixing', 'wait'], ['Wiederholen', 'wait'], ['Repeat', 'wait'],
    ['Erledigt', 'done'], ['Done', 'done'], ['Fertig', 'done'],
    ['Abgeschlossen', 'done'], ['Ship it', 'done'],
    // …and “gelernt” is finished, not “lernen” — the done test runs first.
    ['Gelernt', 'done'],
  ];
  cases.forEach(([title, want]) => eq('kind · ' + title, K.bucketKind(title), want));
  eq('kind · four kinds and no more', Object.keys(K.KIND_SLOT), ['open', 'doing', 'wait', 'done']);
}

/* A vault of notes with frontmatter — what a folder board reads. */
function makeVault(specs) {
  const front = new Map();
  const files = specs.map(sp => {
    const f = new TFile();
    f.path = sp.path;
    f.basename = sp.path.split('/').pop().replace(/\.md$/, '');
    f.stat = { mtime: sp.mtime || 0, ctime: sp.ctime || 0 };
    f.parent = { path: sp.path.split('/').slice(0, -1).join('/') || '/' };
    front.set(f.path, sp.status == null ? {} : { status: sp.status });
    return f;
  });
  return {
    _files: files,
    _front: front,
    vault: {
      getMarkdownFiles: () => files.slice(),
      getAbstractFileByPath: (p) => files.find(f => f.path === p) || null,
      async cachedRead(f) { return (specs.find(s => s.path === f.path) || {}).body || ''; },
      on() { return {}; },
    },
    metadataCache: {
      resolvedLinks: {},
      getFileCache: (f) => ({ frontmatter: front.get(f.path) }),
      getFirstLinkpathDest: () => null,
      on() { return {}; },
    },
    fileManager: {
      async processFrontMatter(f, fn) { const fm = front.get(f.path) || {}; fn(fm); front.set(f.path, fm); },
    },
    workspace: { getLeaf: () => ({ openFile() {} }) },
  };
}
const SCHOOL = [
  { path: 'School/Photosynthese.md' },                       // nothing set
  { path: 'School/Zellteilung.md', status: 'In Arbeit' },
  { path: 'School/Osmose.md', status: 'In Arbeit' },
  { path: 'School/Enzyme.md', status: 'Erledigt' },
  { path: 'School/Genetik.md', status: 'Blockiert' },        // nobody configured this
];
const FOLDER_SRC = ['source: folder', 'folder: School', '## Offen', '## In Arbeit @2', '## Erledigt'].join('\n');
function folderBoard(app, src) {
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const cfg = K.parseKanban(src == null ? FOLDER_SRC : src);
  const el = document.getElementById('stage').createDiv();
  return { kb, cfg, el, source: B.folderSource(kb, cfg, el, { sourcePath: 'Board.md' }) };
}

// ── the folder source groups by the note's own frontmatter ────────────────
{
  const app = makeVault(SCHOOL);
  const { source } = folderBoard(app);
  const cols = source.columns();
  eq('folder · the headings are the columns, plus one nobody configured',
     cols.map(c => c.title), ['Offen', 'In Arbeit', 'Erledigt', 'Blockiert']);
  // The unconfigured column is named the way the NOTES name it: dropping a
  // card into it has to write those words back, not a slugged version of them.
  eq('folder · and it is named the way the notes name it', cols[3].title, 'Blockiert');
  eq('folder · a note with no value lands in the first column',
     cols[0].items.map(f => f.basename), ['Photosynthese']);
  eq('folder · a value lands in its own column',
     cols[1].items.map(f => f.basename), ['Osmose', 'Zellteilung']);
  eq('folder · and so does the last one', cols[2].items.map(f => f.basename), ['Enzyme']);
  eq('folder · a value nobody configured still gets a column, never the floor',
     cols[3].items.map(f => f.basename), ['Genetik']);
  eq('folder · the WIP limit is read off the heading, same as a block board', cols[1].limit, 2);
  eq('folder · and the count says so', cols[1].count.text, '2/2');
  eq('folder · the column kind comes from its name', cols.map(c => c.kind),
     ['open', 'doing', 'done', 'wait']);
  eq('folder · the head counts notes, not cards', source.total(), '5 notes');
}

// ── a move is written into the NOTE ───────────────────────────────────────
{
  const app = makeVault(SCHOOL);
  const { source } = folderBoard(app);
  source.columns();
  await source.move(0, 0, 2);                       // Photosynthese → Erledigt
  eq('move · the new column is written into the note as its label',
     app._front.get('School/Photosynthese.md').status, 'Erledigt');
  ok('move · and nothing else in the note is touched',
     Object.keys(app._front.get('School/Photosynthese.md')).length === 1);
  await sleep(0);
  const back = folderBoard(app).source;
  back.columns();
  await back.move(2, 1, 0);                         // …and back to the first column
  eq('move · the first column is the ABSENCE of a value, not the word “open”',
     Object.prototype.hasOwnProperty.call(app._front.get('School/Photosynthese.md'), 'status'), false);
}
{
  // Dropping a card back where it already is must not rewrite the note.
  const app = makeVault(SCHOOL);
  const { source } = folderBoard(app);
  source.columns();
  await source.move(1, 0, 1);
  eq('move · a drop into its own column changes nothing',
     app._front.get('School/Osmose.md').status, 'In Arbeit');
}

// ── the folder board renders as the same component ────────────────────────
{
  const app = makeVault(SCHOOL);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const el = document.getElementById('stage').createDiv();
  kb.render(FOLDER_SRC, el, { sourcePath: 'Board.md' }, { fence: 'nexus-kanban' });
  ok('render · a folder board is a kanban board', el.hasClass('nx-kb') && el.hasClass('is-folder'));
  eq('render · with the same column strip', el.querySelectorAll('.nx-kb-col').length, 4);
  eq('render · and the same cards', el.querySelectorAll('.nx-kb-card').length, 5);
  eq('render · the WIP limit is on the column', el.querySelectorAll('.nx-kb-col-count')[1].textContent, '2/2');
  ok('render · a card carries a state dot instead of a checkbox',
     !!el.querySelector('.nx-kb-card-dot') && !el.querySelector('.nx-kb-check'));
  ok('render · the filter field is there', !!el.querySelector('.nx-kb-search'));
  eq('render · and a tally chip per used column', el.querySelectorAll('.nx-kb-tally-chip').length, 4);
  // …and a block board in the same page is still the block board.
  const el2 = document.getElementById('stage').createDiv();
  kb.render('## A\n- [ ] one', el2, { sourcePath: 'Board.md' }, { fence: 'nexus-kanban' });
  ok('render · a block board still has its checkbox and its add row',
     !!el2.querySelector('.nx-kb-check') && !!el2.querySelector('.nx-kb-add'));
  ok('render · and a folder board has no add row', !el.querySelector('.nx-kb-add'));
}

// ── the ```nexus-board``` fence is an alias, not a second board ────────────
{
  const ALIAS = { source: 'folder', mode: 'grid', statusProp: 'status' };
  const old = [
    'folder: SCHOOL/Biology',
    'mode: board',
    'statusproperty: phase',
    'states: Offen, In Arbeit, Ausbessern, Erledigt',
    'sort: modified',
    'dir: desc',
    'size: large',
    'props: due',
    'show: excerpt, tags, links, orphans, state',
  ].join('\n');
  const now = [
    'source: folder',
    'folder: SCHOOL/Biology',
    'mode: board',
    'status: phase',
    'sort: modified',
    'dir: desc',
    'size: large',
    'props: due',
    '## Offen',
    '## In Arbeit',
    '## Ausbessern',
    '## Erledigt',
  ].join('\n');
  const a = K.parseKanban(old, ALIAS);
  const b = K.parseKanban(now);
  // `given` is not configuration — it is a record of HOW the block was written,
  // so the two boards are the same board written two ways.
  const same = (c) => { const x = Object.assign({}, c); delete x.given; return JSON.stringify(x); };
  eq('alias · the old syntax and the new one are the same configuration', same(a), same(b));
  eq('alias · what differs is only how it was written',
     [!!a.given.source, a.given.status, !!a.given.states, !!a.given.show],
     [false, 'statusproperty', true, false ? 1 : true]);
  eq('alias · the new syntax says so in its own way',
     [!!b.given.source, b.given.status, !!b.given.states, !!b.given.headings],
     [true, 'status', false, true]);

  /* THE property: a block that arrived in the old syntax is written back in the
     old syntax, byte for byte. A writer that picks its own favourite spelling
     reshapes text somebody typed by hand — `states:` into four headings, a
     `source: folder` line into a fence that never needed one. */
  eq('alias · an old fence is written back exactly as it was', K.stringifyKanban(a), old);
  eq('alias · including a fence with nothing but a folder and a mode',
     K.stringifyKanban(K.parseKanban('folder: SCHOOL/Biology\nmode: grid\nshow: excerpt, tags, links, state', ALIAS)),
     'folder: SCHOOL/Biology\nmode: grid\nshow: excerpt, tags, links, state');
  eq('alias · and the “columns:”/“direction:” spellings',
     K.stringifyKanban(K.parseKanban('folder: X\ncolumns: A, B\ndirection: desc', ALIAS)),
     'folder: X\ncolumns: A, B\ndirection: desc');
  eq('alias · a fence that never said “source:” never grows one',
     K.stringifyKanban(a).indexOf('source:'), -1);
  eq('alias · and its columns stay one line, not four headings',
     K.stringifyKanban(a).indexOf('## '), -1);
  eq('alias · what it writes back parses back to the same board',
     same(K.parseKanban(K.stringifyKanban(a), ALIAS)), same(a));
  // A WIP limit has no spelling in a `states:` line, so adding one moves the
  // columns to headings — the one shape change, and it is forced.
  const limited = K.parseKanban(old, ALIAS);
  limited.buckets[1].limit = 2;
  ok('alias · a WIP limit moves the columns to headings, because a list has no room for it',
     K.stringifyKanban(limited).indexOf('## In Arbeit @2') >= 0, K.stringifyKanban(limited));
  ok('alias · and then the states line is gone, not doubled',
     K.stringifyKanban(limited).indexOf('states:') < 0, K.stringifyKanban(limited));
  eq('alias · a bare fence is a folder board', K.parseKanban('folder: X', ALIAS).source, 'folder');
  eq('alias · showing the grid, as it always did', K.parseKanban('folder: X', ALIAS).mode, 'grid');
  eq('alias · “show:” switches parts off, not only on', K.parseKanban('show: state', ALIAS).excerpt, false);
  eq('alias · and the graph is one of them', K.parseKanban('show: state, graph', ALIAS).graph, true);
}
{
  // Same fence, same notes, same board: the alias renders the columns the new
  // syntax renders, card for card.
  const app = makeVault(SCHOOL);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const ALIAS = { source: 'folder', mode: 'grid', statusProp: 'status' };
  const stage = document.getElementById('stage');
  const a = stage.createDiv(), b = stage.createDiv();
  kb.render('folder: School\nmode: board\nstates: Offen, In Arbeit, Erledigt', a,
            { sourcePath: 'Board.md' }, { fence: 'nexus-board', defaults: ALIAS });
  kb.render(FOLDER_SRC, b, { sourcePath: 'Board.md' }, { fence: 'nexus-kanban' });
  eq('alias · the old fence draws the same columns',
     [...a.querySelectorAll('.nx-kb-col-title')].map(x => x.textContent),
     [...b.querySelectorAll('.nx-kb-col-title')].map(x => x.textContent));
  eq('alias · holding the same cards',
     [...a.querySelectorAll('.nx-kb-card-t')].map(x => x.textContent),
     [...b.querySelectorAll('.nx-kb-card-t')].map(x => x.textContent));
  eq('alias · and a save goes back into ITS fence, not the kanban one', a._nxFence, 'nexus-board');
}

// ── the grid and the graph moved out, and are not lost ────────────────────
{
  const app = makeVault(SCHOOL);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const ALIAS = { source: 'folder', mode: 'grid', statusProp: 'status' };
  const el = document.getElementById('stage').createDiv();
  kb.render('folder: School\nshow: excerpt, tags, links, state, graph', el,
            { sourcePath: 'Board.md' }, { fence: 'nexus-board', defaults: ALIAS });
  ok('grid · the old default mode lands in the graph block', el.hasClass('nx-graph'));
  eq('grid · every note once, as a card', el.querySelectorAll('.nx-graph-grid .nx-kb-card').length, 5);
  ok('grid · drawn with the SAME card as the board', !!el.querySelector('.nx-graph-grid .nx-kb-card-t'));
  ok('grid · and “show: graph” still draws the web', !!el.querySelector('.nx-graph-canvas canvas'));

  const g = document.getElementById('stage').createDiv();
  kb.render('folder: School', g, { sourcePath: 'Board.md' },
            { fence: 'nexus-graph', defaults: { source: 'folder', mode: 'graph' } });
  ok('graph · its own block defaults to the web', !!g.querySelector('.nx-graph-canvas canvas'));
  eq('graph · and shows no grid beside it', g.querySelectorAll('.nx-graph-grid').length, 0);
  eq('graph · “view: grid” is the other arrangement',
     K.parseKanban('view: grid', { source: 'folder', mode: 'graph' }).mode, 'grid');
  eq('graph · and “view: board” hands it back to the columns',
     K.parseKanban('view: board', { source: 'folder', mode: 'graph' }).mode, 'board');
}

// ── the edges of a folder board ───────────────────────────────────────────
{
  const app = makeVault(SCHOOL);
  // No headings at all: the board still has columns, and they are written into
  // its own config so the ⋮ menu edits the same list the fence holds.
  const { cfg, source } = folderBoard(app, 'source: folder\nfolder: School');
  const cols = source.columns();
  eq('edges · a board that names no columns gets the default ones',
     cols.map(c => c.title), ['Offen', 'In Arbeit', 'Ausbessern', 'Erledigt', 'Blockiert']);
  eq('edges · and the config knows them too', cfg.buckets.map(b => b.title),
     ['Offen', 'In Arbeit', 'Ausbessern', 'Erledigt']);
}
{
  const app = makeVault(SCHOOL);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const el = document.getElementById('stage').createDiv();
  kb.render(FOLDER_SRC, el, { sourcePath: 'Board.md' }, { fence: 'nexus-kanban' });
  const cols = el.querySelectorAll('.nx-kb-col');
  eq('edges · a configured column can be renamed from the board',
     cols[0].querySelectorAll('.nx-kb-col-menu').length, 1);
  eq('edges · a column that only exists because a note says so cannot',
     cols[3].querySelectorAll('.nx-kb-col-menu').length, 0);
}
{
  const app = makeVault([]);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const el = document.getElementById('stage').createDiv();
  kb.render('source: folder\nfolder: Nowhere\n## Offen\n## Erledigt', el,
            { sourcePath: 'Board.md' }, { fence: 'nexus-kanban' });
  ok('edges · an empty folder says so above its columns',
     (el.querySelector('.nx-kb-empty') || {}).textContent === 'No notes in "Nowhere" yet.',
     el.textContent);
  eq('edges · and the columns are still there to drop into', el.querySelectorAll('.nx-kb-col').length, 2);
}

// ── the Board module's one setting has to survive its removal ─────────────
{
  /* DEFAULT_SETTINGS is merged in before the migration runs, so "untouched"
     is the default value and not a missing key — getting that wrong silently
     drops whatever the user had chosen. */
  const load = async (saved) => {
    const p = new window.NexusSuite({ workspace: {}, vault: {} }, {});
    p.loadData = async () => saved;
    await p.loadSettings();
    return p.settings;
  };
  const moved = await load({ board: { enabled: true, statusProperty: 'phase' } });
  eq('migrate · a chosen state property moves to the kanban module',
     moved.kanban.statusProperty, 'phase');
  eq('migrate · and the board key is gone', moved.board, undefined);
  const kept = await load({ board: { statusProperty: 'phase' }, kanban: { statusProperty: 'phase2' } });
  eq('migrate · a property already set on the kanban side wins',
     kept.kanban.statusProperty, 'phase2');
  const fresh = await load({});
  eq('migrate · a vault that never had one keeps the default',
     fresh.kanban.statusProperty, 'status');
}

// ── a key this source does not have is somebody's line, not ours ──────────
/* The parser reads both sources' keys out of one block. A key it consumes but
   cannot write back is a line deleted from the user's note on the next save,
   so a block board has to leave every folder key exactly where it found it. */
{
  const src = 'title: Roadmap\nsort: modified\nsize: large\nstatus: phase\n## A\n- [ ] one';
  eq('keep · a block board writes a folder key back untouched',
     K.stringifyKanban(K.parseKanban(src)), src);
  eq('keep · and does not act on it', K.parseKanban(src).sort, 'name');
  const withStates = K.parseKanban('states: Alpha, Beta\n## Backlog\n- [ ] one');
  eq('keep · “states:” makes no phantom columns on a block board',
     withStates.buckets.map(b => b.title), ['Backlog']);
  ok('keep · it is kept as a line instead',
     withStates.extra.join('|').indexOf('states: Alpha, Beta') >= 0, withStates.extra.join('|'));
  eq('keep · an unknown key is still kept', K.parseKanban('wibble: 3').extra, ['wibble: 3']);
}
{
  // `notes:` and `folder:` are the same key on a block board, and always were:
  // whichever comes last wins, and neither line disappears.
  eq('keep · folder: after notes: wins', K.parseKanban('notes: A\nfolder: B').notes, 'B');
  eq('keep · notes: after folder: wins', K.parseKanban('folder: B\nnotes: A').notes, 'A');
  eq('keep · written back in the spelling it was typed in',
     K.stringifyKanban(K.parseKanban('notes: A\nfolder: B')), 'folder: B');
  eq('keep · so “folder:” on a block board round trips as itself',
     K.stringifyKanban(K.parseKanban('folder: Projects\n## A')), 'folder: Projects\n## A');
  eq('keep · and an explicit “source: block” is not swallowed',
     K.stringifyKanban(K.parseKanban('source: block\n## A')), 'source: block\n## A');
}
{
  // `source:` decides which keys the block has, and it does not have to be the
  // first line for that to be true.
  const late = K.parseKanban('folder: School\nsort: modified\nsource: folder');
  eq('keep · source: read even when it is written last', late.source, 'folder');
  eq('keep · so the keys above it are its own', late.folder, 'School');
  eq('keep · all of them', late.sort, 'modified');
}
{
  // The status property must survive a settings default changing under it —
  // which it only does if the board names it in its own block.
  const cfg = K.parseKanban('source: folder\nfolder: School\nstatus: status\n## Offen',
                            { source: 'folder', statusProp: 'phase' });
  eq('keep · a named status property beats the settings default', cfg.statusProp, 'status');
  ok('keep · and is written back, so the default can never take it over',
     K.stringifyKanban(cfg).indexOf('status: status') >= 0, K.stringifyKanban(cfg));
}
{
  const src = 'source: folder\nfolder: School\nmode: graph\nstatus: status\nheight: 400\nnotes: Cards\ntemplate: T\n## Offen';
  eq('keep · a folder board keeps its height, notes and template',
     K.stringifyKanban(K.parseKanban(src)), src);
}

// ── the folder a board is asking about ────────────────────────────────────
{
  const app = makeVault(SCHOOL);
  // Empty "folder:" means the folder this note is in. A note at the vault root
  // has none, and the board must then show nothing — not the whole vault.
  const rootless = folderBoard(app, 'source: folder\n## Offen');
  const rootSrc = B.folderSource(rootless.kb, rootless.cfg, rootless.el, { sourcePath: 'Board.md' });
  eq('folder · a board at the vault root claims no folder', rootSrc.root, '');
  eq('folder · and therefore no notes', rootSrc.total(), '0 notes');
  eq('folder · without writing a folder into the block', rootless.cfg.folder, '');

  const withIndex = makeVault(SCHOOL.concat([{ path: 'School/Index.md' }]));
  const inside = folderBoard(withIndex, 'source: folder\n## Offen');
  const insideSrc = B.folderSource(inside.kb, inside.cfg, inside.el, { sourcePath: 'School/Index.md' });
  eq('folder · inside a folder it is that folder', insideSrc.root, 'School');
  eq('folder · still without pinning it into the block', inside.cfg.folder, '');
  eq('folder · and the board is the folder minus itself', insideSrc.total(), '5 notes');
}

// ── renaming a column renames what the notes say ──────────────────────────
{
  const app = makeVault(SCHOOL);
  const { kb, cfg, source } = folderBoard(app);
  kb.save = async () => {};              // the fence is not what is under test
  source.columns();
  await source.renameColumn(1, 'Läuft');
  eq('rename · the column carries its notes with it',
     app._front.get('School/Osmose.md').status, 'Läuft');
  eq('rename · all of them', app._front.get('School/Zellteilung.md').status, 'Läuft');
  eq('rename · and the block says the same', cfg.buckets[1].title, 'Läuft');
  ok('rename · a column it does not hold is left alone',
     app._front.get('School/Enzyme.md').status === 'Erledigt');
  await source.renameColumn(0, 'Neu');
  eq('rename · the first column names nothing, so nothing is written',
     Object.prototype.hasOwnProperty.call(app._front.get('School/Photosynthese.md'), 'status'), false);
}
{
  // A rename that never reached the fence must not touch the notes either, or
  // they would say something no column claims.
  const app = makeVault(SCHOOL);
  const { kb, cfg, source } = folderBoard(app);
  kb.save = async () => false;
  source.columns();
  await source.renameColumn(1, 'Läuft');
  eq('rename · a block that could not be written leaves the notes alone',
     app._front.get('School/Osmose.md').status, 'In Arbeit');
  eq('rename · and the column keeps its name', cfg.buckets[1].title, 'In Arbeit');
}

// ── the state dot walks the configured columns only ───────────────────────
{
  const app = makeVault(SCHOOL);
  const kb = new K.NexusKanban({ app, settings: { kanban: { enabled: true } } });
  const el = document.getElementById('stage').createDiv();
  kb.render(FOLDER_SRC, el, { sourcePath: 'Board.md' }, { fence: 'nexus-kanban' });
  const cols = el.querySelectorAll('.nx-kb-col');
  ok('stray · the column no one configured is marked as such', cols[3].hasClass('is-stray'));
  ok('stray · the configured ones are not', !cols[0].hasClass('is-stray'));
  // Genetik sits in the stray column; one click has to put it back on the board.
  cols[3].querySelector('.nx-kb-card-dot').dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await sleep(0);
  eq('stray · clicking its dot walks to a configured column, never to another stray',
     app._front.get('School/Genetik.md').status, undefined);
}

{
  // A value nobody configured must survive a round trip through the board: the
  // column is named after it, and moving a note there writes the same words.
  const app = makeVault(SCHOOL);
  const { source } = folderBoard(app);
  const cols = source.columns();
  await source.move(0, 0, 3);
  eq('stray · a move into it writes the notes' + String.fromCharCode(39) + ' own wording back',
     app._front.get('School/Photosynthese.md').status, 'Blockiert');
  void cols;
}

{
  // The graph block's fence says what it is, so it does not need the line
  // either — and its default view is not something it has to write down.
  const G = { source: 'folder', mode: 'graph', statusProp: 'status' };
  eq('graph · its fence writes no source line',
     K.stringifyKanban(K.parseKanban('folder: School', G)), 'folder: School');
  eq('graph · nor its default view',
     K.stringifyKanban(K.parseKanban('folder: School', G)).indexOf('mode:'), -1);
  eq('graph · a view the user chose IS written',
     K.stringifyKanban(K.parseKanban('folder: School\nview: grid', G)), 'folder: School\nview: grid');
}


// ── `tags` must not be written twice ───────────────────────────────────────
// It is a card flag on a block board and a `show:` flag on a folder board.
// Emitting it in both places gave a folder board a line nobody typed.
{
  const shapes = [
    ['a folder board with a partial show', 'folder: Notes\nshow: excerpt, links', { source: 'folder' }],
    ['one that lists every flag', 'folder: Notes\nshow: excerpt, tags, links, orphans, state', { source: 'folder' }],
    ['one with no show line at all', 'folder: Notes', { source: 'folder' }],
    ['and a block board hiding its tags', '## Backlog\ntags: false', { source: 'block' }],
  ];
  shapes.forEach(([name, src, opt]) => {
    eq('write-back · ' + name + ' comes back unchanged', K.stringifyKanban(K.parseKanban(src, opt)), src);
  });
  const folder = K.stringifyKanban(K.parseKanban('folder: Notes\nshow: excerpt', { source: 'folder' }));
  eq('write-back · and never grows a second tags line', (folder.match(/^tags:/gm) || []).length, 0);
}

} catch (e) { out.push('THREW: ' + (e && e.stack || e)); fail++; }
if (window.__err && window.__err.length) out.push('LOAD ERROR: ' + window.__err.join('\n'));
out.push('');
out.push(fail === 0 ? ('ALL GREEN — ' + pass + ' checks') : (fail + ' FAILED of ' + (pass + fail)));
document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body></html>
