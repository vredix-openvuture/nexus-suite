<!doctype html>
<html><head><meta charset="utf-8"><title>bar visual</title>
<link rel="stylesheet" href="plugin/styles.css">
<style>
/* Obsidian's own variables, dark values — the plugin CSS is written against
   these and would otherwise render on transparent nothing. */
:root {
  --background-primary: #1e1e1e; --background-primary-alt: #262626;
  --background-secondary: #252525; --background-secondary-alt: #1a1a1a;
  --background-modifier-border: #3a3a3a;
  --background-modifier-hover: rgba(255,255,255,.075);
  --background-modifier-active-hover: rgba(255,255,255,.12);
  --text-normal: #dcddde; --text-muted: #999; --text-faint: #666;
  --text-accent: #fb6734; --interactive-accent: #fb6734;
  --radius-m: 8px; --radius-s: 5px;
  --font-interface: system-ui, sans-serif;
}
/* The stub draws no real SVG, so give every icon a visible box — otherwise an
   inactive button is invisible and the layout cannot be judged. */
.svg-icon { display: block; width: 17px; height: 17px; border: 1.4px solid currentColor; border-radius: 4px; opacity: .6; }
.nx-sk-btn { color: var(--text-muted); }
.nx-sk-btn[data-icon]::after {
  content: attr(data-icon); position: absolute; font-size: 7px; color: #6f6f6f;
  bottom: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
}
.nx-sk-btn, .nx-sk-subpen { position: relative; }
.nx-sk-subpen[data-icon]::after {
  content: attr(data-icon); position: absolute; font-size: 7px; color: #6f6f6f;
  bottom: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
}
.nx-sketch-bar, .nx-sketch-subbar { padding-bottom: 16px !important; }
body { margin: 0; background: #141414; color: #dcddde; font-family: system-ui, sans-serif; padding: 28px; }
h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #888; margin: 30px 0 10px; font-weight: 700; }
h2:first-child { margin-top: 0; }
.case { border: 1px solid #333; border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
.nx-sketch-pad { height: 90px; background: #f7f6f2; }
.narrow { width: 400px; }
.note { font-size: 12.5px; color: #7d7d7d; margin: 0 0 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="bundle.js"></script>
<script>
function makeSurface(host, over) {
  return Object.assign({
    host, mode: 'draw', pen: 'fountain', color: '#d92f2f', size: 3,
    autoGrow: false, bgType: 'grid', bgSize: 27, bgOpacity: 0.12,
    paper: 'paper', paperStyle: true, strokes: [],
    setPen(p) { this.pen = p; }, setMode(m) { this.mode = m; },
    setColor(c) { this.color = c; }, setSize(v) { this.size = v; }, getSize() { return this.size; },
    setPaper(p) { this.paper = p; }, setPaperStyle(v) { this.paperStyle = v; },
    setBackground(t) { if (t != null) this.bgType = t; },
    undo() {}, redo() {}, clear() {}, persist() {},
  }, over || {});
}
const plugin = new window.NexusSuite({}, {});
plugin.saveSettings = () => {};
const root = document.getElementById('root');

function show(title, note, opts, tweak, cls) {
  root.insertAdjacentHTML('beforeend', '<h2>' + title + '</h2><p class="note">' + note + '</p>');
  const box = document.createElement('div');
  box.className = 'case' + (cls ? ' ' + cls : '');
  root.appendChild(box);
  const wrap = box.createDiv('nx-sketch is-edit');
  const bar = wrap.createDiv('nx-sketch-bar');
  const pad = wrap.createDiv('nx-sketch-pad');
  const s = JSON.parse(JSON.stringify(window.DEFAULT_SETTINGS.quicksketch));
  if (tweak) tweak(s);
  const surface = makeSurface(pad);
  plugin._buildSketchBar(bar, surface, s, opts);
  return { bar, wrap, surface };
}

show('A · pinned, full-size editor',
     'Tools left, actions right, options row underneath. This is the default.',
     { mode: 'full', onCollapse: () => {} });

show('A · pinned, in a note',
     'Same row, fewer buttons — background / auto-extend / clear sit in the ⋯ menu.',
     { mode: 'compact', onDone: () => {}, onFullscreen: () => {} });

const marker = show('A · the highlighter’s own options',
     'Its settings button, its own sizes, its own colours.',
     { mode: 'full', onCollapse: () => {} });
Array.from(marker.bar.querySelectorAll('.nx-sk-grp-tools .nx-sk-btn'))
  .find(b => b.dataset.icon === 'highlighter').dispatchEvent(new MouseEvent('click', { bubbles: true }));

const eraser = show('A · the eraser has no options',
     'Nothing to configure, so the row collapses instead of sitting there empty.',
     { mode: 'full', onCollapse: () => {} });
Array.from(eraser.bar.querySelectorAll('.nx-sk-grp-tools .nx-sk-btn'))
  .find(b => b.dataset.icon === 'eraser').dispatchEvent(new MouseEvent('click', { bubbles: true }));

show('B · reveal, before the first tap',
     'One row only — the options open when a tool is picked and close on the first stroke.',
     { mode: 'full', onCollapse: () => {} }, s => { s.bar = { mode: 'reveal', compact: null, full: null }; });

show('Phone width · pinned',
     'Tools scroll sideways, actions stay pinned right, the ⋯ menu holds the rest.',
     { mode: 'compact', onDone: () => {}, onFullscreen: () => {} }, null, 'narrow');

show('Phone width · trimmed to three buttons',
     'A device set to pen + eraser only; everything else moved into the menu.',
     { mode: 'compact', onDone: () => {}, onFullscreen: () => {} },
     s => { s.bar = { mode: 'pinned', compact: ['pen', 'eraser'], full: null }; }, 'narrow');
</script>
</body></html>
